async function exportFM1201_4(){
  if(typeof JSZip==='undefined') throw new Error('JSZip 未載入（內嵌函式庫異常，請重新整理頁面）');
  const m = state.meta;
  const bin = Uint8Array.from(atob(TPL_FM1201_4), c => c.charCodeAt(0));
  const zip = await JSZip.loadAsync(bin);
  let xml = await zip.file('word/document.xml').async('string');
  const auditDate = formatAuditDateRange(m.dateFrom, m.dateTo);

  const tblRe = /<w:tbl[\s>][\s\S]*?<\/w:tbl>/g;
  const tables = xml.match(tblRe) || [];
  if (!tables.length) throw new Error('1201-4 範本異常');

  // Header table 0: Ship name, Date, Place, Auditor — values at odd indices
  {
    const tcs = splitTcs(tables[0]);
    const values = [m.vessel||'', auditDate, m.place||'', m.leadAuditor||''];
    let vi=0;
    const newTcs = tcs.map((tc,i)=>{
      if(i%2===1) return makeTc(values[vi++]||'', extractTcPr(tc));
      return tc;
    });
    xml = xml.replace(tables[0], replaceTcsInTable(tables[0], newTcs));
  }

    // Check form-field checkboxes under Yes / multi-select 5.2-5.4 — no font changes
  if (state.checklistAllYes) {
    const rowRe = /<w:tr[\s>][\s\S]*?<\/w:tr>/g;
    const tables2 = xml.match(tblRe) || [];
    for (let ti = 1; ti < tables2.length; ti++) {
      const rows = tables2[ti].match(rowRe) || [];
      const newRows = rows.map(row => {
        const rowText = tcInnerText(row);
        const isMulti = /5\.2|5\.3|5\.4/.test(rowText) && /How did the Master/.test(rowText);
        const cells = splitTcs(row);
        if (!cells.length) return row;
        const c0 = tcInnerText(cells[0]||'').trim();
        const isItem = /^(\d+\.\d+|\d+)$/.test(c0);
        if (!isItem && !isMulti) return row;
        let newRow = row;
        if (isMulti) {
          newRow = newRow.replace(/<w:checkBox>[\s\S]*?<\/w:checkBox>/g, (cb) => checkFormCheckbox(cb, true));
          return newRow;
        }
        // Interview officers 2.2–2.5: Deck / Engine / Rating each have Yes/No (check Yes only = first cb per cell)
        const isInterviewCols = /Does he know|SE policy and DP|muster lists|emergency|familiar with/.test(rowText)
          && cells.filter(c => (c.match(/checkBox/g)||[]).length >= 2).length >= 3;
        if (isInterviewCols || (c0.startsWith('2.') && cells.length >= 5 && (cells[2]+cells[3]+cells[4]).includes('checkBox'))) {
          // Prefer rows under officer interview: three columns with checkboxes at 2,3,4
          const newCells = cells.slice();
          let changed = false;
          for (let ci of [2,3,4]) {
            if (ci >= cells.length || !cells[ci].includes('checkBox')) continue;
            let first = true;
            newCells[ci] = cells[ci].replace(/<w:checkBox>[\s\S]*?<\/w:checkBox>/g, (cb) => {
              if (first) { first = false; changed = true; return checkFormCheckbox(cb, true); }
              return cb;
            });
          }
          if (changed) return replaceTcsInTable(row, newCells);
        }
        // Normal checklist item: first checkbox in Result cell only
        let targetCellIdx = -1;
        for (let ci = 2; ci < Math.min(cells.length, 4); ci++) {
          if (cells[ci].includes('checkBox')) { targetCellIdx = ci; break; }
        }
        if (targetCellIdx < 0) return row;
        let first = true;
        const newCell = cells[targetCellIdx].replace(/<w:checkBox>[\s\S]*?<\/w:checkBox>/g, (cb) => {
          if (first) { first = false; return checkFormCheckbox(cb, true); }
          return cb;
        });
        const newCells = cells.slice();
        newCells[targetCellIdx] = newCell;
        return replaceTcsInTable(row, newCells);
      });
      let i = 0;
      const newTbl = tables2[ti].replace(rowRe, () => newRows[i++] || '');
      xml = xml.replace(tables2[ti], newTbl);
    }
  }


  // Apply No / N/A exceptions (by item number in first cell)
  // Scoped by "ti#section#no[#ordinal]" — matching the same key format used to build CHECKLIST_ITEMS —
  // so identical numbers reused across different parts (A/B/C) *and* across different sections within
  // the same table (e.g. table 1 has "1.2" in both "1. Bridge" and "1. Interview with the Master") don't
  // collide. The one genuine template duplicate (10.27 appearing twice in the same section) is disambiguated
  // by an appended ordinal, resolved by encounter order — matching how CHECKLIST_ITEMS assigns its ordinals.
  {
    const exList = (state.checklistExceptions||[]).filter(e => e && e.no);
    if (exList.length) {
      const byScopedKey = new Map(); // key: "ti#section#no[#ordinal]" -> ex
      const legacyByNo = new Map();  // key: no -> ex (old free-text entries; applies to any table/section, same as pre-fix behaviour)
      exList.forEach(e => {
        const noKey = String(e.no).trim();
        if (e.key) byScopedKey.set(e.key, e);
        else if (!e.ti) legacyByNo.set(noKey, e);
      });
      const rowRe = /<w:tr[\s>][\s\S]*?<\/w:tr>/g;
      const tables2 = xml.match(/<w:tbl[\s>][\s\S]*?<\/w:tbl>/g) || [];
      const SECTION_RE = /^(\d{1,2})\.\s+\S/; // matches "1. Bridge", "10. Maintenance...", but not "1.1"
      for (let ti = 1; ti < tables2.length; ti++) {
        const rows = tables2[ti].match(rowRe) || [];
        let changedTbl = false;
        let curSection = '';
        const seenInSection = new Map(); // no -> count seen so far this section, for ordinal disambiguation
        const newRows = rows.map(row => {
          const cells = splitTcs(row);
          if (!cells.length) return row;
          const c0 = tcInnerText(cells[0]||'').trim();
          // Section header rows have their title in c0 and no numeric item id
          if (SECTION_RE.test(c0) && !/^\d+\.\d+$/.test(c0)) {
            curSection = c0;
            seenInSection.clear();
            return row;
          }
          if (!/^\d+\.\d+$|^\d+$/.test(c0)) return row;
          const occurrence = seenInSection.get(c0) || 0;
          seenInSection.set(c0, occurrence + 1);
          const baseKey = `${ti}#${curSection}#${c0}`;
          // Matches the ordinal scheme used to build CHECKLIST_ITEMS: 1st occurrence has no suffix,
          // 2nd occurrence is "#1", 3rd would be "#2", etc.
          const scopedKey = occurrence > 0 ? `${baseKey}#${occurrence}` : baseKey;
          const ex = byScopedKey.get(scopedKey) || byScopedKey.get(baseKey) || legacyByNo.get(c0);
          if (!ex) return row;
          const newCells = cells.slice();
          // Result: Yes and No are two SEPARATE cells (each with exactly one checkbox), not two
          // checkboxes in one cell — e.g. cell[2] = Yes checkbox, cell[3] = No checkbox. For "No",
          // uncheck the Yes cell and check the No cell.
          const uncheckCell = (cellXml) => cellXml.replace(/<w:checkBox>[\s\S]*?<\/w:checkBox>/g, (cb) =>
            cb.replace(/<w:default w:val="1"\/>/g, '<w:default w:val="0"/>')
              .replace(/<w:checked w:val="1"\/>/g, ''));
          const checkCell = (cellXml) => cellXml.replace(/<w:checkBox>[\s\S]*?<\/w:checkBox>/g, (cb) => checkFormCheckbox(cb, true));
          if (ex.result === 'No') {
            let checkboxCellsFound = 0;
            for (let ci = 2; ci < Math.min(cells.length, 5) && checkboxCellsFound < 2; ci++) {
              if (!cells[ci].includes('checkBox')) continue;
              checkboxCellsFound++;
              newCells[ci] = checkboxCellsFound === 1 ? uncheckCell(cells[ci]) : checkCell(cells[ci]);
            }
          }
          // Remark: append N/A or remark
          const remarkBits = [];
          if (ex.result === 'N/A') remarkBits.push('N/A');
          if (ex.remark) remarkBits.push(ex.remark);
          if (remarkBits.length) {
            // find a remark-like empty cell after result
            for (let ci = 3; ci < Math.min(cells.length, 5); ci++) {
              if (cells[ci].includes('checkBox')) continue;
              const prev = tcInnerText(cells[ci]).trim();
              newCells[ci] = makeTc((prev ? prev+' ' : '') + remarkBits.join(' '), extractTcPr(cells[ci]));
              break;
            }
          }
          changedTbl = true;
          return replaceTcsInTable(row, newCells);
        });
        if (changedTbl) {
          let ri = 0;
          const newTbl = tables2[ti].replace(rowRe, () => newRows[ri++] || '');
          xml = xml.replace(tables2[ti], newTbl);
        }
      }
    }
  }

  // Interview 2.1: three Rank: cells → Deck / Engine / Rating
  {
    const iv = state.interview || {};
    const fills = [
      'Rank: ' + (iv.deckRank||'') + (iv.deckName ? '  Name: '+iv.deckName : ''),
      'Rank: ' + (iv.engRank||'') + (iv.engName ? '  Name: '+iv.engName : ''),
      'Rank: ' + (iv.ratingRank||'') + (iv.ratingName ? '  Name: '+iv.ratingName : ''),
    ];
    const rowRe = /<w:tr[\s>][\s\S]*?<\/w:tr>/g;
    const tables2 = xml.match(/<w:tbl[\s>][\s\S]*?<\/w:tbl>/g) || [];
    for (let ti=0; ti<tables2.length; ti++) {
      const rows = tables2[ti].match(rowRe) || [];
      let changed = false;
      const newRows = rows.map(row => {
        if (!row.includes('Interview with the Officer')) return row;
        const cells = splitTcs(row);
        // c2,c3,c4 are Rank: cells
        const newCells = cells.slice();
        let fi = 0;
        for (let ci=0; ci<cells.length && fi<fills.length; ci++) {
          const t = tcInnerText(cells[ci]).trim();
          if (t === 'Rank:' || t.startsWith('Rank:')) {
            newCells[ci] = makeTc(fills[fi++], extractTcPr(cells[ci]));
            changed = true;
          }
        }
        return changed ? replaceTcsInTable(row, newCells) : row;
      });
      if (changed) {
        let i=0;
        const newTbl = tables2[ti].replace(rowRe, () => newRows[i++] || '');
        xml = xml.replace(tables2[ti], newTbl);
        break;
      }
    }
  }

  
  // 12.1 Date of last internal audit — replace placeholder in that row only
  if (state.meta.lastInternalAuditDate) {
    const rowRe = /<w:tr[\s>][\s\S]*?<\/w:tr>/g;
    const tables = xml.match(/<w:tbl[\s>][\s\S]*?<\/w:tbl>/g) || [];
    for (let ti = 0; ti < tables.length; ti++) {
      const rows = tables[ti].match(rowRe) || [];
      let changed = false;
      const newRows = rows.map(row => {
        if (!/12\.1/.test(tcInnerText(row)) || !/last internal audit/i.test(tcInnerText(row))) return row;
        changed = true;
        return row.replace(/Click here to select(?: a date)?/i, () => {
          const v = String(state.meta.lastInternalAuditDate||'');
          return v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        });
      });
      if (changed) {
        let ri = 0;
        const newTbl = tables[ti].replace(rowRe, () => newRows[ri++] || '');
        xml = xml.replace(tables[ti], newTbl);
        break;
      }
    }
  }

zip.file('word/document.xml', xml);
  const blob = await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  downloadBlob(blob, `FM-1201-4_${(m.vessel||'vessel').replace(/\s/g,'_')}_${m.refNo||'audit'}.docx`);
  toast(state.checklistAllYes ? '已匯出 FM-1201-4（含 Yes）' : '已匯出 FM-1201-4（空白結果欄）');
}



/* ========== FM-0804-1 Training (plain template fill) ========== */
function render0804_1(){
  const m = state.meta;
  return `
  <div class="intro"><h3>⑨ FM-0804-1 訓練／演練紀錄</h3>
    <p>匯出公司空白表單並填入船名等基本資料；不改字體、不加粗。其餘內容請在 Word 中補完（或依公司各演練範本另行套用）。</p></div>
  <div class="panel">
    <div class="form-grid">
      <div class="field"><label>Ship name</label><input value="${esc(m.vessel)}" disabled></div>
      <div class="field"><label>Date</label><input value="${esc(m.dateFrom||'')}" disabled></div>
      <div class="field"><label>Ref / 備註</label><input value="${esc(m.refNo)}" disabled></div>
    </div>
  </div>
  ${navButtonsAuto()}`;
}

async function exportFM0804_1(){
  if(typeof JSZip==='undefined') throw new Error('JSZip 未載入（內嵌函式庫異常，請重新整理頁面）');
  if(typeof TPL_FM0804_1==='undefined') throw new Error('0804 範本未嵌入');
  const m = state.meta;
  const bin = Uint8Array.from(atob(TPL_FM0804_1), c => c.charCodeAt(0));
  const zip = await JSZip.loadAsync(bin);
  let xml = await zip.file('word/document.xml').async('string');
  const escX = (s)=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

  // Append ship name after common labels if present — plain text only
  const fills = [
    [/(Ship\s*name\s*:?\s*)/i, m.vessel||''],
    [/(Vessel\s*:?\s*)/i, m.vessel||''],
    [/(Date\s*:?\s*)/i, m.dateFrom||''],
  ];
  // Only fill clearly empty value cells in first table if structure matches
  const tblRe = /<w:tbl[\s>][\s\S]*?<\/w:tbl>/g;
  const tables = xml.match(tblRe) || [];
  if (tables[0]) {
    const tcs = splitTcs(tables[0]);
    // Heuristic: fill odd empty cells with vessel/date cycling basic meta
    const values = [m.vessel||'', m.dateFrom||'', m.refNo||'', m.place||''];
    let vi = 0;
    const newTcs = tcs.map((tc, i) => {
      const t = tcInnerText(tc).trim();
      if (!t && vi < values.length) {
        return makeTc(values[vi++]||'', extractTcPr(tc));
      }
      return tc;
    });
    if (vi > 0) xml = xml.replace(tables[0], replaceTcsInTable(tables[0], newTcs));
  }

  // Name of ship paragraph style labels
  xml = xml.replace(
    /(<w:p[\s>][\s\S]*?(?:Ship name|Name of Ship|Vessel)[\s\S]*?<\/w:p>)/i,
    (para) => {
      if (!para.endsWith('</w:p>')) return para;
      if (tcInnerText(para).includes(m.vessel||'___NONE___')) return para;
      return para.slice(0,-6)
        + `<w:r><w:t xml:space="preserve">${escX(m.vessel||'')}</w:t></w:r></w:p>`;
    }
  );

  zip.file('word/document.xml', xml);
  const blob = await zip.generateAsync({
    type:'blob',
    mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
  });
  downloadBlob(blob, `FM-0804-1_${(m.vessel||'vessel').replace(/\s/g,'_')}.docx`);
  toast('已匯出 FM-0804-1（公司空白表單填入，未改字體）');
}




/* ========== FM-1201-6 Shipboard Safety Inspection Report ==========
   Aligned with company filled sample (DP approved): category codes,
   record section photos (≈3/slot), deficiency before/after photos.
*/
const SSIR_CATEGORIES = [
  {code:'01', name:'Certificate & Documentation'},
  {code:'02', name:'Structural Conditions'},
  {code:'03', name:'Water/Weathertight conditions'},
  {code:'04', name:'Emergency Systems'},
  {code:'05', name:'Radio Communications'},
  {code:'06', name:'Cargo operations including equipment'},
  {code:'07', name:'Fire safety'},
  {code:'08', name:'Alarms'},
  {code:'09', name:'Working and Living Conditions'},
  {code:'10', name:'Safety of Navigation'},
  {code:'11', name:'Life saving appliances'},
  {code:'12', name:'Dangerous goods'},
  {code:'13', name:'Propulsion and auxiliary machinery'},
  {code:'14', name:'Pollution prevention'},
  {code:'15', name:'ISM'},
  {code:'16', name:'ISPS'},
  {code:'18', name:'Labour Conditions (MLC, 2006)'},
  {code:'19', name:'Industrial Personnel'},
  {code:'99', name:'Other'}
];
const SSIR_STATUS = ['', 'Satisfactory', 'Minor Deficiency', 'Major Deficiency', 'Not Evaluated'];
const SSIR_RECORD_SECTIONS = [
  'Hull integrity',
  'Deck machinery and arrangement',
  'Engine machinery and arrangement',
  'Cargo space and lashing bridge',
  'Lifesaving Appliances and Fire Fighting Equipment',
  'Navigation Bridge',
  'Environmental protection equipment',
  'Accommodation and Living Conditions'
];
const SSIR_PIC_OPTIONS = ['','MS','CO','2O','3O','CE','2E','3E','4E','CCK','BSN','FT','Other'];

function ensureSsir(){
  if(!state.ssir || typeof state.ssir!=='object'){
    state.ssir = {
      inspector2: '',
      pscVerified: '',
      comments: '',
      categories: {},
      records: {},
      recordPhotos: {},
      defects: [],
      totalMajor: '',
      totalMinor: ''
    };
  }
  const s = state.ssir;
  if(!s.categories) s.categories = {};
  if(!s.records) s.records = {};
  if(!s.recordPhotos) s.recordPhotos = {};
  if(!Array.isArray(s.defects)) s.defects = [];
  SSIR_CATEGORIES.forEach(c => {
    if(s.categories[c.name]===undefined) s.categories[c.name] = '';
  });
  SSIR_RECORD_SECTIONS.forEach(name => {
    if(s.records[name]===undefined) s.records[name] = '';
    if(!Array.isArray(s.recordPhotos[name])) s.recordPhotos[name] = [];
  });
  return s;
}

function updateSsir(key, val){ ensureSsir(); state.ssir[key]=val; scheduleSave(); }
function updateSsirCat(name, val){ ensureSsir(); state.ssir.categories[name]=val; scheduleSave(); }
function updateSsirRec(name, val){ ensureSsir(); state.ssir.records[name]=val; scheduleSave(); }
function updateSsirDefect(i, key, val){
  ensureSsir();
  if(state.ssir.defects[i]) state.ssir.defects[i][key]=val;
  scheduleSave();
}
function addSsirDefect(){
  ensureSsir();
  if(state.ssir.defects.length>=10){ toast('範本最多約 10 筆缺失'); return; }
  state.ssir.defects.push({code:'', description:'', descZh:'', descEn:'', pic:'', picOther:'', remarks:'', beforePhotos:[], afterPhotos:[]});
  renderStep(); scheduleSave();
}
function delSsirDefect(i){
  ensureSsir();
  state.ssir.defects.splice(i,1);
  renderStep(); scheduleSave();
}

/* mode: 'camera' | 'gallery' — see pickImageFiles() for iOS camera black-screen fix rationale */
function ssirPickImages(mode, cb){
  pickImageFiles(mode, async(fileList)=>{
    const files=[...fileList].filter(f=>f.type.startsWith('image/'));
    if(!files.length) return;
    const urls=[];
    for(const f of files){
      try{ urls.push(await fileToDataURL(f)); }catch(e){}
    }
    if(urls.length) cb(urls);
  });
}
function addSsirRecordPhotos(section, mode){
  ensureSsir();
  ssirPickImages(mode, urls=>{
    const arr = state.ssir.recordPhotos[section]||[];
    state.ssir.recordPhotos[section] = arr.concat(urls).slice(0,6); // 2 rows × 3 photos
    renderStep(); scheduleSave();
  });
}
function removeSsirRecordPhoto(section, idx){
  ensureSsir();
  const arr = state.ssir.recordPhotos[section]||[];
  arr.splice(idx,1);
  renderStep(); scheduleSave();
}
function addSsirDefectPhoto(di, kind, mode){
  ensureSsir();
  const d = state.ssir.defects[di];
  if(!d) return;
  if(!Array.isArray(d.beforePhotos)) d.beforePhotos=[];
  if(!Array.isArray(d.afterPhotos)) d.afterPhotos=[];
  ssirPickImages(mode, urls=>{
    if(kind==='before') d.beforePhotos = d.beforePhotos.concat(urls).slice(0,4);
    else d.afterPhotos = d.afterPhotos.concat(urls).slice(0,4);
    renderStep(); scheduleSave();
  });
}
function removeSsirDefectPhoto(di, kind, idx){
  ensureSsir();
  const d = state.ssir.defects[di];
  if(!d) return;
  const arr = kind==='before' ? d.beforePhotos : d.afterPhotos;
  if(arr) arr.splice(idx,1);
  renderStep(); scheduleSave();
}

        </div>
        <div class="field full"><label>Description of Defective item · English <span style="color:var(--nc)">(exported to Word)</span></label>
          <textarea rows="2" onchange="updateSsirDefect(${i},'descEn',this.value); updateSsirDefect(${i},'description',this.value)">${esc(d.descEn||'')}</textarea>
        </div>
        <div class="field full"><label>Remarks</label>
          <textarea rows="2" onchange="updateSsirDefect(${i},'remarks',this.value)">${esc(d.remarks||'')}</textarea>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
        <div style="border:1px dashed var(--line);border-radius:10px;padding:10px;background:#fafbfc">
          <div style="font-size:12px;font-weight:700;color:#c00000;margin-bottom:8px">Photo of Defective item</div>
          <p style="font-size:11px;color:var(--muted);margin:0 0 8px">Auditor · before rectification</p>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px">${before||'<span style="font-size:12px;color:var(--muted)">No photo</span>'}</div>
          <button type="button" class="hbtn ghost" onclick="addSsirDefectPhoto(${i},'before','camera')">📷 Take photo</button>
          <button type="button" class="hbtn ghost" onclick="addSsirDefectPhoto(${i},'before','gallery')">🖼 Add from library</button>
        </div>
        <div style="border:1px dashed var(--line);border-radius:10px;padding:10px;background:#fafbfc">
          <div style="font-size:12px;font-weight:700;color:#2f7d32;margin-bottom:8px">Rectification Photo</div>
          <p style="font-size:11px;color:var(--muted);margin:0 0 8px">Ship · after rectification</p>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px">${after||'<span style="font-size:12px;color:var(--muted)">No photo</span>'}</div>
          <button type="button" class="hbtn ghost" onclick="addSsirDefectPhoto(${i},'after','camera')">📷 Take photo</button>
          <button type="button" class="hbtn ghost" onclick="addSsirDefectPhoto(${i},'after','gallery')">🖼 Add from library</button>
        </div>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="intro"><h3>⑩ FM-1201-6 Shipboard Safety Inspection Report</h3>
    <p>Fill company blank form. Header from meta. Category status, record photos (3 per row), and deficiencies with before/after photos. Word export uses <b>English</b> description only.</p></div>
  <div class="panel">
    <div class="panel-title">Header</div>
    <div class="form-grid">
      <div class="field"><label>Ship name</label><input value="${esc(m.vessel)}" disabled></div>
      <div class="field"><label>Reference No.</label><input value="${esc(m.refNo)}" disabled></div>
      <div class="field"><label>Date</label><input value="${esc(formatAuditDateRange(m.dateFrom, m.dateTo))}" disabled></div>
      <div class="field"><label>Place</label><input value="${esc(m.place)}" disabled></div>
      <div class="field"><label>Inspector</label><input value="${esc(m.leadAuditor)}" disabled></div>
      <div class="field"><label>Inspector (2nd)</label>
        <input value="${esc(s.inspector2||'')}" onchange="updateSsir('inspector2', this.value)"></div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-title">Category · Status</div>
    <div style="overflow:auto">
      <table style="width:100%;border-collapse:collapse">
        <thead><tr style="background:#f0faf4">
          <th style="padding:6px;border:1px solid var(--line);width:48px">Code</th>
          <th style="padding:6px;border:1px solid var(--line);text-align:left">Category</th>
          <th style="padding:6px;border:1px solid var(--line);width:200px">Status</th>
        </tr></thead>
        <tbody>${catRows}</tbody>
      </table>
    </div>
    <div class="form-grid" style="margin-top:12px">
      <div class="field"><label>Has previous PSC deficiency been verified?</label>
        <select onchange="updateSsir('pscVerified', this.value)">
          <option value="" ${!s.pscVerified?'selected':''}>—</option>
          <option value="Yes" ${s.pscVerified==='Yes'?'selected':''}>Yes</option>
          <option value="No" ${s.pscVerified==='No'?'selected':''}>No</option>
        </select>
      </div>
      <div class="field full"><label>Inspector comments</label>
        <textarea rows="4" onchange="updateSsir('comments', this.value)">${esc(s.comments||'')}</textarea>
      </div>
    </div>
  </div>
  <div class="intro" style="margin-top:8px"><h3>Shipboard Safety Inspection Record</h3>
    <p style="margin:0">Each item: up to <b>3 photos per row</b> (max 6). Matches Word template layout.</p></div>
  ${recBlocks}
  <div class="panel">
    <div class="panel-title">Total Deficiencies (Major / Minor)</div>
    <div class="form-grid">
      <div class="field"><label>Major</label>
        <input value="${esc(s.totalMajor||'')}" onchange="updateSsir('totalMajor', this.value)"></div>
      <div class="field"><label>Minor</label>
        <input value="${esc(s.totalMinor||'')}" onchange="updateSsir('totalMinor', this.value)"></div>
    </div>
  </div>
  <div class="intro"><h3>Deficiencies</h3>
    <p style="margin:0">No. auto-numbered. Code = Category code above. PIC from list or custom. Description: Chinese for draft, <b>English only</b> to Word.</p></div>
  ${defBlocks}
  <button type="button" class="add-row" onclick="addSsirDefect()">＋ Add deficiency</button>
  ${navButtonsAuto()}`;
}


async function exportFM1201_6(){
  if(typeof JSZip==='undefined') throw new Error('JSZip 未載入');
  if(typeof TPL_FM1201_6==='undefined') throw new Error('FM-1201-6 範本未嵌入');
  const m = state.meta||{};
  const s = ensureSsir();
  const bin = Uint8Array.from(atob(TPL_FM1201_6), c => c.charCodeAt(0));
  const zip = await JSZip.loadAsync(bin);
  let xml = await zip.file('word/document.xml').async('string');
  const escX = (t)=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // Image packing (same approach as photo report)
  const mediaFiles = [];
  const imageRels = [];
  let relId = 100, drawSeq = 1;
  function addImg(bytes){
    const id = 'rIdSsir'+(relId++);
    const name = `ssir${mediaFiles.length+1}.jpeg`;
    mediaFiles.push({name, bytes});
    imageRels.push({id, target:'media/'+name});
    return id;
  }
  function imageParagraph(dataURL, maxW){
    try{
      const bytes = dataURLToBytes(dataURL);
      const {width,height} = jpegSize(bytes);
      const ratio = height/Math.max(width,1);
      const wIn = maxW, hIn = maxW*ratio;
      const cx = Math.round(wIn*(typeof EMU_PER_IN!=='undefined'?EMU_PER_IN:914400));
      const cy = Math.round(hIn*(typeof EMU_PER_IN!=='undefined'?EMU_PER_IN:914400));
      const rId = addImg(bytes);
      const drawId = drawSeq++;
      return `<w:p><w:pPr><w:spacing w:after="60"/><w:jc w:val="center"/></w:pPr><w:r><w:drawing>
        <wp:inline distT="0" distB="0" distL="0" distR="0">
          <wp:extent cx="${cx}" cy="${cy}"/>
          <wp:docPr id="${drawId}" name="Picture ${drawId}"/>
          <a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">
            <a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">
              <pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">
                <pic:nvPicPr><pic:cNvPr id="${drawId}" name="ssir${drawId}"/><pic:cNvPicPr/></pic:nvPicPr>
                <pic:blipFill><a:blip r:embed="${rId}" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>
                <pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>
              </pic:pic>
            </a:graphicData>
          </a:graphic>
        </wp:inline>
      </w:drawing></w:r></w:p>`;
    }catch(e){ return '<w:p></w:p>'; }
  }

  const tblRe = /<w:tbl[\s>][\s\S]*?<\/w:tbl>/g;
  let tables = xml.match(tblRe) || [];
  if(tables.length < 5) throw new Error('1201-6 範本表格結構異常');

  // Table 0 header
  {
    const tcs = splitTcs(tables[0]);
    const finalTcs = tcs.slice();
    const map = {1:m.vessel||'', 3:m.refNo||'', 5:formatAuditDateRange(m.dateFrom,m.dateTo), 7:m.place||'', 9:m.leadAuditor||'', 11:s.inspector2||'-'};
    Object.keys(map).forEach(i=>{
      const ii=+i;
      if(ii<tcs.length && map[ii]) finalTcs[ii]=makeTc(map[ii], extractTcPr(tcs[ii]));
    });
    xml = xml.replace(tables[0], replaceTcsInTable(tables[0], finalTcs));
  }
  tables = xml.match(tblRe)||[];

  // Table 1 categories + PSC + comments
  {
    let tbl = tables[1];
    SSIR_CATEGORIES.forEach(c=>{
      const st = (s.categories&&s.categories[c.name])||'';
      if(!st) return;
      tbl = tbl.replace(/<w:tr[\s>][\s\S]*?<\/w:tr>/g, (row)=>{
        if(!tcInnerText(row).includes(c.name)) return row;
        let done=false;
        return row.replace(/>Select</g, (mm)=>{ if(done) return mm; done=true; return '>'+escX(st)+'<'; });
      });
    });
    if(s.pscVerified==='Yes'||s.pscVerified==='No'){
      tbl = tbl.replace(/<w:tr[\s>][\s\S]*?<\/w:tr>/g, (row)=>{
        if(!/previous PSC deficiency/i.test(tcInnerText(row))) return row;
        if(s.pscVerified==='Yes') return row.replace(/☐Yes/g,'☑Yes').replace(/☐No/g,'☐No');
        return row.replace(/☐No/g,'☑No').replace(/☐Yes/g,'☐Yes');
      });
    }
    if(s.comments){
      tbl = tbl.replace(/<w:tr[\s>][\s\S]*?<\/w:tr>/g, (row)=>{
        if(!/Inspector comments/i.test(tcInnerText(row))) return row;
        const cells=splitTcs(row);
        if(!cells.length) return row;
        const idx=cells.length-1;
        const newCells=cells.slice();
        newCells[idx]=cells[idx].replace(/<\/w:tc>\s*$/, `<w:p><w:r><w:t xml:space="preserve">${escX(s.comments)}</w:t></w:r></w:p></w:tc>`);
        return replaceTcsInTable(row, newCells);
      });
    }
    xml = xml.replace(tables[1], tbl);
  }
  tables = xml.match(tblRe)||[];

  // Table 3 record sections + photos
  {
    let tbl = tables[3];
    const rowRe=/<w:tr[\s>][\s\S]*?<\/w:tr>/g;
    const rows=tbl.match(rowRe)||[];
    SSIR_RECORD_SECTIONS.forEach(name=>{
      const note=(s.records&&s.records[name])||'';
      const photos=(s.recordPhotos&&s.recordPhotos[name])||[];
      let hi=-1;
      rows.forEach((row,ri)=>{ if(tcInnerText(row).includes(name)) hi=ri; });
      if(hi<0) return;
      let photoOffset=0;
      for(let j=hi+1;j<Math.min(hi+3,rows.length);j++){
        const t=tcInnerText(rows[j]).trim();
        if(t && SSIR_RECORD_SECTIONS.some(sec=>t.includes(sec))) break;
        const cells=splitTcs(rows[j]);
        if(!cells.length) continue;
        const newCells=cells.slice();
        // each content row: up to 3 photos in a row
        const imgs=photos.slice(photoOffset, photoOffset+3);
        if(imgs.length){
          imgs.forEach((src,k)=>{
            if(k<newCells.length){
              const pr=extractTcPr(cells[k]||cells[0]);
              newCells[k]=`<w:tc>${pr||''}${imageParagraph(src, 2.1)}</w:tc>`;
            }
          });
          rows[j]=replaceTcsInTable(rows[j], newCells);
          photoOffset+=imgs.length;
          if(photoOffset>=photos.length && photoOffset>=3) continue;
          if(photoOffset>=photos.length) break;
          continue;
        } else if(note && (!t || t.length<2)){
          newCells[0]=makeTc(note, extractTcPr(cells[0]));
          rows[j]=replaceTcsInTable(rows[j], newCells);
          break;
        }
      }
    });
    let ri=0;
    tbl=tbl.replace(rowRe,()=>rows[ri++]||'');
    xml=xml.replace(tables[3], tbl);
  }
  tables = xml.match(tblRe)||[];

  // Table 4 totals + defects text (+ try photos)
  {
    let tbl=tables[4];
    const rowRe=/<w:tr[\s>][\s\S]*?<\/w:tr>/g;
    const rows=tbl.match(rowRe)||[];
    if(rows[0] && (s.totalMajor||s.totalMinor)){
      const cells=splitTcs(rows[0]);
      if(cells.length>=4){
        const newCells=cells.slice();
        if(s.totalMajor) newCells[1]=makeTc(s.totalMajor, extractTcPr(cells[1]));
        if(s.totalMinor) newCells[3]=makeTc(s.totalMinor, extractTcPr(cells[3]));
        rows[0]=replaceTcsInTable(rows[0], newCells);
      }
    }
    const defects=s.defects||[];
    let di=0;
    for(let ri=0; ri<rows.length && di<defects.length; ri++){
      if(ri>0 && /No\./.test(tcInnerText(rows[ri-1]||'')) && !/Photo of Defective/i.test(tcInnerText(rows[ri]))){
        const d=defects[di++];
        const cells=splitTcs(rows[ri]);
        if(cells.length>=3){
          const newCells=cells.slice();
          if(newCells[0]) newCells[0]=makeTc(String(di).padStart(2,'0')+'.', extractTcPr(cells[0]));
          if(newCells[1]) newCells[1]=makeTc(d.code||'', extractTcPr(cells[1]));
          if(newCells[2]) newCells[2]=makeTc((d.descEn||d.description||''), extractTcPr(cells[2]));
          if(newCells[3]) newCells[3]=makeTc((d.pic==='Other'?(d.picOther||'Other'):(d.picOther||d.pic))||'', extractTcPr(cells[3]));
          if(newCells[4]) newCells[4]=makeTc(d.remarks||'', extractTcPr(cells[4]));
          rows[ri]=replaceTcsInTable(rows[ri], newCells);
        }
        // photo row: search forward for empty photo cells after "Photo of Defective"
        for(let k=ri+1;k<Math.min(ri+4,rows.length);k++){
          if(/Photo of Defective/i.test(tcInnerText(rows[k]))) continue;
          if(/No\./.test(tcInnerText(rows[k]))) break;
          const cells=splitTcs(rows[k]);
          if(cells.length>=2 && !(d.beforePhotos||[]).length && !(d.afterPhotos||[]).length) break;
          if(cells.length>=2){
            const newCells=cells.slice();
            const b=(d.beforePhotos||[])[0];
            const a=(d.afterPhotos||[])[0];
            if(b) newCells[0]=`<w:tc>${extractTcPr(cells[0])||''}${imageParagraph(b, 2.4)}</w:tc>`;
            if(a && newCells[1]) newCells[1]=`<w:tc>${extractTcPr(cells[1])||''}${imageParagraph(a, 2.4)}</w:tc>`;
            rows[k]=replaceTcsInTable(rows[k], newCells);
            break;
          }
        }
      }
    }
    let ri=0;
    tbl=tbl.replace(rowRe,()=>rows[ri++]||'');
    xml=xml.replace(tables[4], tbl);
  }

  zip.file('word/document.xml', xml);

  // relationships + media
  if(mediaFiles.length){
    let rels = await zip.file('word/_rels/document.xml.rels').async('string');
    imageRels.forEach(r=>{
      rels = rels.replace('</Relationships>',
        `<Relationship Id="${r.id}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="${r.target}"/>\n</Relationships>`);
    });
    zip.file('word/_rels/document.xml.rels', rels);
    mediaFiles.forEach(f=>{
      zip.file('word/media/'+f.name, f.bytes);
    });
  }

  const blob = await zip.generateAsync({
    type:'blob',
    mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
  });
  downloadBlob(blob, `FM-1201-6_${(m.vessel||'vessel').replace(/\s/g,'_')}_${m.refNo||'insp'}.docx`);
  toast('已匯出 FM-1201-6（對照公司範本填入）');
}

/* Boot */
function boot(){
  restore();
  renderSidebar();
  renderStep();
  updateExportBtn();
}
boot();
</script>
