<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>內稽工具 · Aether Audit Suite</title>
<style>
:root{
  --navy:#006633; --navy2:#008040; --deep:#002060;
  --nc:#CC0000; --ob:#E67000; --find:#2f7d32;
  --ink:#1a2333; --muted:#6b7688; --line:#d7dde8; --bg:#eef1f6; --card:#fff;
  --sidebar:220px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font-family:inherit;font-size:13.5px}
textarea{resize:vertical}
button{cursor:pointer}

/* Sidebar */
#sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar);
  background:linear-gradient(165deg,#0f3d2a 0%,#1a5c3e 40%,#2a7a52 70%,#1a5c3e 100%);
  color:#e8f5ee;overflow-y:auto;z-index:100;display:flex;flex-direction:column;
  box-shadow:inset -1px 0 0 rgba(255,255,255,.08), 2px 0 12px rgba(0,40,20,.15)}
#sidebar .logo{padding:14px 14px 10px;border-bottom:1px solid rgba(255,255,255,.14);
  background:linear-gradient(110deg,rgba(216,235,224,.12),rgba(185,214,198,.08))}
#sidebar .logo h1{font-size:13px;font-weight:700;color:#f3fbf6;line-height:1.35;letter-spacing:.02em}
#sidebar .logo p{font-size:10.5px;color:#b8dcc8;margin-top:2px}
#sidebar nav{flex:1;padding:6px 0}
#sidebar .step{display:flex;align-items:flex-start;gap:8px;padding:8px 12px;cursor:pointer;border-left:3px solid transparent;color:#d4ebe0}
#sidebar .step:hover{background:rgba(255,255,255,.07)}
#sidebar .step.active{background:rgba(255,255,255,.14);border-left-color:#a8e6c3;color:#fff;box-shadow:inset 0 0 12px rgba(168,230,195,.12)}
#sidebar .step .badge{flex-shrink:0;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.15);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
#sidebar .step.active .badge{background:#ffd24d;color:#002060}
#sidebar .step .lbl{font-size:12px;line-height:1.35}
#sidebar .step .lbl small{display:block;font-size:10px;opacity:.65;margin-top:1px}
#sidebar .foot{padding:10px 12px;border-top:1px solid rgba(255,255,255,.1);font-size:10.5px;color:#8899cc}

#sb-toggle{display:none;position:fixed;bottom:18px;left:14px;z-index:200;width:46px;height:46px;border-radius:50%;border:none;background:var(--deep);color:#ffd24d;font-size:20px;box-shadow:0 3px 12px rgba(0,0,0,.3)}
#sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}

#main{margin-left:var(--sidebar);min-height:100vh;display:flex;flex-direction:column}
header.bar{
  background:linear-gradient(110deg,#d8ebe0,#c5dfd0,#e8f4ee,#b9d6c6);
  border-bottom:1px solid rgba(0,80,40,.12);padding:10px 16px;display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 8px rgba(20,60,40,.1);position:sticky;top:0;z-index:50;flex-wrap:wrap}
header.bar h2{font-size:14.5px;font-weight:700;color:#0d3d28}
header.bar .ind{font-size:11.5px;color:#3d6b54;font-weight:600}
.spacer{flex:1}
.hbtn{border:none;border-radius:7px;padding:6px 11px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.hbtn.ghost{background:rgba(255,255,255,.5);color:#0d3d28;border:1px solid rgba(0,80,40,.2)}
.hbtn.primary{background:#ffd24d;color:#3a2e00}
.hbtn.warn{background:rgba(180,40,40,.12);color:#8a2a22;border:1px solid rgba(180,40,40,.2)}
.hbtn:hover{filter:brightness(.96)}
.hbtn:disabled{opacity:.55;cursor:not-allowed}
.wordicon{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:3px;background:linear-gradient(155deg,#2f8ae0,#123f85);color:#fff;font-size:10px;font-weight:800;font-family:Georgia,serif}

#content{flex:1;padding:18px;max-width:960px;margin:0 auto;width:100%}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,40,80,.05)}
.panel-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:12px}
.intro{background:linear-gradient(135deg,#e8f4ee,#d4eae0);border:1px solid rgba(0,80,40,.15);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.intro h3{font-size:13.5px;color:#0d3d28;margin-bottom:3px}
.intro p{font-size:12px;color:#3d6b54;line-height:1.55}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:11px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:11.5px;font-weight:600;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:7px;padding:7px 9px}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 2px rgba(0,128,64,.12)}
.field.full{grid-column:1/-1}

.step-nav{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}

/* Audit plan */
.plan-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.plan-table th{background:#f0f2f8;padding:6px 8px;border:1px solid var(--line);text-align:left;font-size:11px}
.plan-table td{border:1px solid var(--line);padding:4px}
.plan-table input,.plan-table textarea{width:100%;border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:4px}
.plan-table input:focus,.plan-table textarea:focus{border-color:var(--navy2);background:#fff}
.plan-table .del{border:none;background:#fdeaea;color:#b12318;width:28px;height:28px;border-radius:6px}
.add-row{border:2px dashed var(--line);border-radius:8px;width:100%;padding:8px;background:none;color:var(--muted);margin-top:8px;font-size:12.5px}
.add-row:hover{border-color:var(--navy);color:var(--navy)}

/* Photo tabs */
.ptabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.ptab{border:2px solid var(--line);border-radius:8px;padding:6px 14px;font-size:12.5px;font-weight:700;background:#fff;color:var(--muted)}
.ptab.active.nc{border-color:var(--nc);background:#fdeaea;color:var(--nc)}
.ptab.active.ob{border-color:var(--ob);background:#fff3e0;color:var(--ob)}
.ptab.active.find{border-color:var(--find);background:#e8f5e9;color:var(--find)}
.ptab .cnt{font-size:11px;opacity:.8;margin-left:4px}

.fgroup{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff;margin-bottom:12px}
.fgroup.tag-NC{border-left:4px solid var(--nc)}
.fgroup.tag-OB{border-left:4px solid var(--ob)}
.fgroup.tag-FINDING{border-left:4px solid var(--find)}
.fgroup.collapsed{background:#f7f9fd}
.fhead{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f7f9fd;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fgroup.collapsed .fhead{background:transparent}
.fno{font-weight:800;color:var(--navy);min-width:22px}
.ftag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px}
.ftag.NC{background:#fdeaea;color:var(--nc)}
.ftag.OB{background:#fff3e0;color:var(--ob)}
.ftag.FINDING{background:#e8f5e9;color:var(--find)}
.fhead select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px}
.fhead .spacer{flex:1}
.confirmbtn{border:none;border-radius:7px;padding:5px 11px;font-size:12px;font-weight:700}
.confirmbtn.go{background:#2f7d32;color:#fff}
.confirmbtn.edit{background:#e8f5ee;color:var(--navy)}

.fdesc{padding:8px 10px 4px}
.caprow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:560px){.caprow{grid-template-columns:1fr}}
.capcol label{font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:3px}
.capcol textarea{border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:12.5px;min-height:48px;width:100%}
.rt{background:#e8f5ee;color:var(--navy);border:none;border-radius:5px;padding:1px 7px;font-size:10.5px;font-weight:700}
.tstat{font-size:10.5px;font-weight:700;margin-left:auto}
.tstat.busy{color:#8a6d00}.tstat.ok{color:#2f7d32}.tstat.err{color:#b12318}
.fdesc-ro{padding:2px 10px 6px;font-size:13px}
.fdesc-ro .en{font-weight:700}.fdesc-ro .zh{margin-top:2px;color:#333}
.fphotos{padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px}
.fphoto{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fbfcfe}
.fphoto .ptop{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fphoto .ptop select{border:1px solid var(--line);border-radius:6px;padding:3px 5px;font-size:11.5px;min-width:100px}
.fphoto .ptop button{border:none;width:26px;height:26px;border-radius:6px;background:#e8f5ee;color:var(--navy);font-size:13px}
.fphoto .ptop button.del{background:#fdeaea;color:#b12318}
.pthumb{padding:6px 8px 8px;display:flex;justify-content:center;background:#0d1526}
.pthumb img{max-width:100%;max-height:280px;object-fit:contain;display:block;border-radius:6px}

#content.has-dropbar{padding-bottom:88px}
.step-nav{position:relative;z-index:5;background:var(--bg);padding:8px 0 4px;margin-bottom:4px}
.dropbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);box-shadow:0 -3px 12px rgba(20,40,80,.1);padding:9px 14px;display:flex;align-items:center;gap:10px;margin-left:var(--sidebar)}
.dropbar.hot{background:#e6f5ec}
.dz-hit{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer}
.dz-text{font-size:12.5px}.dz-text b{color:var(--navy)}

.drop-credit b{color:var(--navy)}

.placeholder{text-align:center;padding:40px 16px;color:var(--muted)}
.placeholder h3{color:var(--ink);margin-bottom:6px}
.empty{color:var(--muted);text-align:center;padding:28px 10px;font-size:13.5px}
.flash-green{
  outline:3px solid #39ff14 !important;
  outline-offset:2px;
  box-shadow:0 0 0 3px rgba(57,255,20,.35), 0 0 14px rgba(57,255,20,.55) !important;
  transition:outline .15s, box-shadow .15s;
}

.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:300;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}

@media(max-width:768px){
  #sidebar{transform:translateX(-100%);transition:transform .25s}
  #sidebar.open{transform:translateX(0)}
  #sb-overlay.open{display:block}
  #sb-toggle{display:flex;align-items:center;justify-content:center}
  #main{margin-left:0}
  .dropbar{margin-left:0}
  #content{padding:12px}
}
@media print{
  #sidebar,#sb-toggle,#sb-overlay,header.bar .hbtn,.dropbar,.step-nav,.no-print{display:none!important}
  #main{margin-left:0}
  .fgroup{break-inside:avoid;border:1px solid #333}
}
</style>
</head>
<body>

<div id="sidebar">
  <div class="logo">
    <h1>內稽工具 · Aether</h1>
    <p>Evergreen MAT</p>
  </div>
  <nav id="stepNav"></nav>
  <div class="foot">
    <div id="projectLabel">未載入專案</div>
    <div style="margin-top:4px">製作人 王韋淳</div>
  </div>
</div>
<div id="sb-overlay" onclick="closeSidebar()"></div>
<button id="sb-toggle" onclick="toggleSidebar()" type="button">☰</button>

<div id="main">
  <header class="bar">
    <h2 id="headerTitle">基本資料</h2>
    <span class="ind" id="stepIndicator"></span>
    <span class="spacer"></span>
    <span id="saveStat" style="font-size:11px;color:#3d6b54;white-space:nowrap" class="no-print"></span>
    <button class="hbtn warn no-print" type="button" onclick="confirmNew()">🗒 新專案</button>
    <button class="hbtn ghost no-print" type="button" onclick="loadProject()">📂 開啟</button>
    <button class="hbtn ghost no-print" type="button" onclick="saveProject()">📥 暫存</button>
    <button class="hbtn ghost no-print" type="button" onclick="saveProjectAs()">💾 另存</button>
    <button class="hbtn ghost no-print" type="button" onclick="exportAllPhotosZip()">🗂 照片打包 ZIP</button>
    <button class="hbtn primary no-print" type="button" id="exportBtn" onclick="exportCurrent()">
      <span class="wordicon">W</span> 匯出 Word
    </button>
  </header>
  <div id="content"></div>
</div>

<div class="dropbar no-print" id="dropbar" style="display:none">
  <div class="dz-hit" id="dropHit" tabindex="0"
    ondragover="dz(event,1)" ondragleave="dz(event,0)" ondrop="onDrop(event)"
    style="flex:1;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span style="font-size:20px">🖼️</span>
    <span class="dz-text" style="flex:1;min-width:120px">拖曳到畫面任意處或 Ctrl+V 也可貼上</span>
    <button type="button" class="hbtn ghost" onclick="pickImageFiles('camera', addPhotos)">📷 拍照（新項目）</button>
    <button type="button" class="hbtn ghost" onclick="pickImageFiles('gallery', addPhotos)">🖼 匯入照片（新項目）</button>
    <button type="button" class="hbtn ghost" onclick="addEmptyFinding()">＋ 新增缺失項目（無照片）</button>
  </div>
</div>

<div class="toast" id="toast"></div>

/** Single day → one date; range only when from≠to */

function formatAuditDateRange(from, to){
  const a = (from||'').trim();
  const b = (to||'').trim();
  if(a && b && a===b) return a;
  if(a && b) return a + ' ~ ' + b;
  return a || b || '';
}

function formatAuditDate(dateStr){
    const MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    const s=(dateStr||'').trim();
    let m1=s.match(/^(\d{4})[./\-]?(\d{2})[./\-]?(\d{2})$/);
    if(m1) return `${MONTHS[+m1[2]-1]}.${m1[3]}, ${m1[1]}`;
    if(s) return s;
    const t=new Date();
    return `${MONTHS[t.getMonth()]}.${String(t.getDate()).padStart(2,'0')}, ${t.getFullYear()}`;
  }

    document.getElementById('content').classList.toggle('has-dropbar', currentStep===3);

  const nextBtn = (next!==null && next!==undefined)
    ? `<button class="hbtn primary" type="button" onclick="goStep(${next})">下一步 →</button>` : '';
  return `<div class="step-nav no-print">${prevBtn}${nextBtn}</div>`;
}

  const prev = currentStep>0 ? currentStep-1 : null;

  return navButtons(prev, next);
}

/* ===== Step 2: Photos ===== */
function nextFindingNo(){
  if(!Array.isArray(state.emptyFindingNos)) state.emptyFindingNos = [];
  const used = new Set([
    ...state.photos.map(p=>p.findingNo).filter(Boolean),
    ...state.emptyFindingNos
  ]);
  let n=1; while(used.has(n)) n++; return n;
}

/** Re-sequence finding numbers: NC → OB → FINDING, then by old number. No gaps.
    Includes findings that have zero photos (state.emptyFindingNos). */
function renumberFindings() {
  if(!Array.isArray(state.emptyFindingNos)) state.emptyFindingNos = [];
  // collect groups by current findingNo
  const map = new Map();
  state.photos.forEach(p => {
    const k = p.findingNo || 0;
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(p);
  });
  // empty findings: represented with an empty photos array so they flow through the same sort/remap
  state.emptyFindingNos.forEach(no => {
    if (!map.has(no)) map.set(no, []);
  });
  const tagOrder = { NC: 0, OB: 1, FINDING: 2 };
  const groups = [...map.entries()].map(([no, photos]) => {
    // Prefer majority / first photo tag; align findings tag if present
    const tag = (photos[0] && photos[0].tag) || (state.findings[String(no)]||{}).tag || 'FINDING';
    return { no, photos, tag };
  });
  groups.sort((a, b) => {
    const ta = tagOrder[a.tag] ?? 9, tb = tagOrder[b.tag] ?? 9;
    if (ta !== tb) return ta - tb;
    return a.no - b.no;
  });
  const newFindings = {};
  const collapsed2 = {};
  const newEmptyNos = [];
  // Remap existing NC records by old findingNo → newNo (before numbers change meaning)
  if(!state.ncs) state.ncs = [];
  const ncsByOld = new Map(state.ncs.map(n => [String(n.findingNo), n]));
  const remappedNcs = [];
  const usedNcIds = new Set();
  groups.forEach((g, idx) => {
    const newNo = idx + 1;
    const oldKey = String(g.no);
    const oldF = state.findings[oldKey] || {};
    g.photos.forEach(p => { p.findingNo = newNo; p.tag = g.tag; });
    if (g.photos.length === 0) newEmptyNos.push(newNo);
    newFindings[String(newNo)] = {
      descZh: oldF.descZh || '',
      descEn: oldF.descEn || '',
      tag: g.tag
    };
    if (state.collapsed[oldKey]) collapsed2[String(newNo)] = true;
    // carry NC row across renumber when this group is NC
    if (g.tag === 'NC') {
      const oldNc = ncsByOld.get(oldKey);
      if (oldNc && !usedNcIds.has(oldNc.id)) {
        oldNc.findingNo = newNo;
        remappedNcs.push(oldNc);
        usedNcIds.add(oldNc.id);
      }
    }
  });
  // Keep remapped NC order; syncNcsFromPhotos will refresh list & deviation text
  if (remappedNcs.length) state.ncs = remappedNcs;
  state.findings = newFindings;
  state.collapsed = collapsed2;
  state.emptyFindingNos = newEmptyNos;
  syncNcsFromPhotos();
}

function groupPhotos(filterTag){
  if(!Array.isArray(state.emptyFindingNos)) state.emptyFindingNos = [];
  const map = new Map();
  state.photos.forEach(p=>{
    if(filterTag && filterTag!=='ALL' && p.tag!==filterTag) return;
    const key = p.findingNo || ('u'+p.id);
    if(!map.has(key)) map.set(key, []);
    map.get(key).push(p);
  });
  const groups=[];
  map.forEach((photos, key)=>{
    const first=photos[0];
    const fkey = String(first.findingNo||key);
    const desc = state.findings[fkey] || {descZh:'',descEn:'',tag:first.tag};
    groups.push({key:fkey, findingNo:first.findingNo, tag:first.tag||'FINDING', photos, desc});
  });
  // Empty findings (no photos yet) — still shown so they can be filled in or photographed later
  state.emptyFindingNos.forEach(no=>{
    const fkey = String(no);
    const desc = state.findings[fkey] || {descZh:'',descEn:'',tag:'FINDING'};
    const tag = desc.tag || 'FINDING';
    if(filterTag && filterTag!=='ALL' && tag!==filterTag) return;
    groups.push({key:fkey, findingNo:no, tag, photos:[], desc});
  });
  // order: NC, OB, FINDING then by findingNo
  const order={NC:0,OB:1,FINDING:2};
  groups.sort((a,b)=>{
    const ta=order[a.tag]??9, tb=order[b.tag]??9;
    if(ta!==tb) return ta-tb;
    return (a.findingNo||999)-(b.findingNo||999);
  });
  return groups;
}
function countsByTag(){
  const c={NC:0,OB:0,FINDING:0,ALL:state.photos.length};
  const seen=new Set();
  state.photos.forEach(p=>{
    const k=p.findingNo+'|'+p.tag;
    if(!seen.has(k)){ seen.add(k); if(c[p.tag]!=null) c[p.tag]++; }
  });
  (state.emptyFindingNos||[]).forEach(no=>{
    const tag = (state.findings[String(no)]||{}).tag || 'FINDING';
    const k = no+'|'+tag;
    if(!seen.has(k)){ seen.add(k); if(c[tag]!=null) c[tag]++; }
  });
  return c;
}

function renderPhotos(){

  const obF = allG.filter(g=>g.tag==='OB').length;
  const findF = allG.filter(g=>g.tag==='FINDING').length;
  const pct = (n) => totalF ? Math.round(n*1000/totalF)/10 : 0;
  const stats = `<div class="panel" style="padding:10px 14px;margin-bottom:10px">

      <span style="color:var(--find)">Finding <b>${findF}</b> 項（${pct(findF)}%）</span>
    </div>
  </div>`;
  const tabs = `

      <button type="button" class="ptab ${photoTab==='ALL'?'active find':''}" onclick="setPhotoTab('ALL')">全部 <span class="cnt">${c.ALL} 張照片</span></button>
      <button type="button" class="ptab ${photoTab==='NC'?'active nc':''}" onclick="setPhotoTab('NC')">NC <span class="cnt">${c.NC} 項</span></button>

      <button type="button" class="ptab ${photoTab==='FINDING'?'active find':''}" onclick="setPhotoTab('FINDING')">Finding <span class="cnt">${c.FINDING} 項</span></button>
    </div>`;
  let body;
  if(!state.photos.length && !(state.emptyFindingNos||[]).length){
    body=`<div class="empty">尚未匯入照片或新增缺失項目。請用畫面最下方匯入區加入。</div>`;
  } else if(!groups.length){
    body=`<div class="empty">此分頁尚無項目。</div>`;
  } else {
    body=groups.map(g=>groupCard(g)).join('');
  }
  return `
  <div class="intro"><h3>③ 照片彙整</h3>
    <p>標記 <b>NC</b>（紅）／<b>OB</b>（橘）／<b>Finding</b>（綠）。同一缺失可多張照片。中文敘述可自動翻成英文。標成 NC 的項目後續會連動 1201-3／0901-1（下階段）。</p></div>
  ${stats}
  ${tabs}
  <div id="groups">${body}</div>
  ${navButtonsAuto()}`;
}

function groupCard(g){
  const collapsed = !!state.collapsed[g.key];
  const tag=g.tag||'FINDING';

function reorderPhotoInFinding(id, dir){
  const p = state.photos.find(x => x.id === id);
  if (!p) return;
  const same = state.photos
    .map((x, i) => ({x, i}))
    .filter(o => o.x.findingNo === p.findingNo);
  const pos = same.findIndex(o => o.x.id === id);
  const target = pos + dir;
  if (target < 0 || target >= same.length) return;
  const iA = same[pos].i, iB = same[target].i;
  const tmp = state.photos[iA];
  state.photos[iA] = state.photos[iB];
  state.photos[iB] = tmp;
  renderStep();
  scheduleSave();
  requestAnimationFrame(() => flashGreen(document.getElementById('p_'+id)));
}

/* Add photos (from camera or gallery) directly into an existing finding number.

async function addPhotosToFinding(findingNo, files){
  const list=[...files].filter(f=>f.type.startsWith('image/'));
  if(!list.length){ toast('沒有圖片檔'); return; }
  const existing = state.photos.filter(p=>p.findingNo===findingNo);
  const tag = (existing[0] && existing[0].tag) || (state.findings[String(findingNo)]||{}).tag || 'FINDING';
  for(const f of list){

  if(Array.isArray(state.emptyFindingNos)){
    state.emptyFindingNos = state.emptyFindingNos.filter(n=>n!==findingNo);

function movePhoto(id, val){
  const p=state.photos.find(x=>x.id===id); if(!p) return;
  let no;
  if(val==='new'){
    no=nextFindingNo();
    ensureFinding(String(no), p.tag);
  } else {
    no=parseInt(val,10);
    // 歸屬到既有項目：跟隨該項目既有標誌，不改動整組標誌
    const sibling=state.photos.find(x=>x.findingNo===no && x.id!==id);
    if(sibling) p.tag = sibling.tag;
    ensureFinding(String(no), p.tag);
  }
  p.findingNo=no;
  renumberFindings();
  // 記錄移動後的新編號（renumber 可能改號）
  const newNo = p.findingNo;
  renderStep(); scheduleSave();
  requestAnimationFrame(()=>{
    const el = document.getElementById('p_'+id) || document.getElementById('g_'+newNo);

async function translateZhToEn(text){
  text=(text||'').trim();
  if(!text) return '';
  try{
    const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-TW&tl=en&dt=t&q='+encodeURIComponent(text);
    const r=await fetch(url);
    if(r.ok){
      const j=await r.json();
      const en=(j[0]||[]).map(x=>x[0]).join('').trim();
      if(en) return en;
    }
  }catch(e){}
  try{
    const url2='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=zh-TW|en';
    const r2=await fetch(url2);
    const j2=await r2.json();
    const out=j2&&j2.responseData&&j2.responseData.translatedText?j2.responseData.translatedText.trim():'';
    if(out) return out;
  }catch(e){}
  throw new Error('offline');
}

/* Photo import */
function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=1280;
        let w=img.width, h=img.height;
        if(w>max || h>max){ const s=Math.min(max/w,max/h); w=Math.round(w*s); h=Math.round(h*s); }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',0.85));
      };
      img.onerror=rej;
      img.src=fr.result;
    };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
/* Shared file input builder.
   mode='camera': sets capture="environment" so iOS/Android opens the camera directly instead of the
   photo-library picker. This avoids a known iOS Safari issue where <input type=file accept=image/*>
   without a capture hint can open the camera UI but show a black/frozen preview.
   mode='gallery': no capture attribute, opens the normal photo library / file picker.
   iOS does not allow multi-select in camera mode (capture implies single shot), so multiple is only
   set for gallery mode.
   Implementation note: uses a <label for="..."> bound to the input, rather than calling input.click()
   directly from JS. Some iOS WebKit-based browsers (observed: Edge on iOS) treat a programmatic
   .click() on a file input — especially one positioned off-screen — as not being a "real" user
   gesture, and silently fail to open the camera (or, per Apple's own developer forums, can crash the
   host app's WKWebView). A <label> click is handled natively by the browser as equivalent to clicking
   the input itself, without any JS in the trigger path, which is the more reliable pattern across
   iOS browsers. The input stays in the DOM (0x0 size, opacity 0, NOT off-screen) rather than being
   created/destroyed per call, since some WebKit versions are also flaky about inputs added and
   clicked in the same tick. */
let __pickImageFilesCallback = null;
function __ensurePickImageInput(mode){
  const id = mode === 'camera' ? '__pickCameraInput' : '__pickGalleryInput';
  let inp = document.getElementById(id);
  if(inp) return inp;
  inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.id = id;
  if(mode === 'camera'){
    inp.capture = 'environment';
  } else {
    inp.multiple = true;
  }
  // Kept in normal document flow (not position:fixed/off-screen) — 0-size and invisible, but still
  // a "real" element the OS considers part of the page, which matters for some WebKit versions.
  inp.style.width = '0';
  inp.style.height = '0';
  inp.style.opacity = '0';
  inp.style.overflow = 'hidden';
  inp.style.position = 'absolute';
  inp.tabIndex = -1;
  inp.setAttribute('aria-hidden', 'true');
  inp.onchange = () => {
    const cb = __pickImageFilesCallback;
    __pickImageFilesCallback = null;
    if(inp.files && inp.files.length && cb) cb(inp.files);
    inp.value = ''; // allow re-selecting the same file next time
  };
  document.body.appendChild(inp);
  return inp;
}
function pickImageFiles(mode, onFiles){
  const inp = __ensurePickImageInput(mode);
  __pickImageFilesCallback = onFiles;
  // Trigger via a synthetic label click rather than inp.click() directly — see note above.
  const label = document.createElement('label');
  label.setAttribute('for', inp.id);
  label.style.display = 'none';
  document.body.appendChild(label);
  label.click();
  label.remove();
}
async function addPhotos(files){
  const list=[...files].filter(f=>f.type.startsWith('image/'));
  if(!list.length){ toast('沒有圖片檔'); return; }
  for(const f of list){
    try{
      const img=await fileToDataURL(f);
      const no=nextFindingNo();
      const tag = photoTab!=='ALL' ? photoTab : 'FINDING';
      const id=uid++;
      state.photos.push({id, img, tag, findingNo:no});
      ensureFinding(String(no), tag);
    }catch(e){ console.warn(e); }
  }
  renumberFindings();
  if(currentStep!==3){ currentStep=3; renderSidebar(); } renderStep();
  scheduleSave();
  toast(`已加入 ${list.length} 張照片`);
}
/* pickFiles() removed — superseded by pickImageFiles('camera'|'gallery', cb) */
function hasDragFiles(e){
  try{
    const types = e.dataTransfer && e.dataTransfer.types;
    if(!types) return false;
    return [...types].includes('Files');
  }catch(err){ return false; }
}
function showDropOverlay(on){
  const ov = document.getElementById('dropOverlay');
  if(!ov) return;
  ov.classList.toggle('show', !!on);
  ov.setAttribute('aria-hidden', on ? 'false' : 'true');
  const db = document.getElementById('dropbar');
  if(db) db.classList.toggle('hot', !!on);
}
function dz(e,on){
  e.preventDefault();
  if(currentStep!==3){ showDropOverlay(false); return; }
  showDropOverlay(!!on);
}
function onDrop(e){
  e.preventDefault();
  e.stopPropagation();
  showDropOverlay(false);
  if(currentStep!==3) return;
  const files = e.dataTransfer && e.dataTransfer.files;
  if(files && files.length) addPhotos(files);
}
// Full-page drag: any drag of files on photos step → whole screen is drop zone
let _dragDepth = 0;
document.addEventListener('dragenter', e=>{
  if(currentStep!==3 || !hasDragFiles(e)) return;
  e.preventDefault();
  _dragDepth++;
  showDropOverlay(true);
});
document.addEventListener('dragover', e=>{
  if(currentStep!==3 || !hasDragFiles(e)) return;
  e.preventDefault();
  try{ e.dataTransfer.dropEffect = 'copy'; }catch(err){}
  showDropOverlay(true);
});
document.addEventListener('dragleave', e=>{
  if(currentStep!==3) return;
  _dragDepth = Math.max(0, _dragDepth-1);
  if(_dragDepth===0) showDropOverlay(false);
});
document.addEventListener('drop', e=>{
  if(!hasDragFiles(e)) return;
  _dragDepth = 0;
  onDrop(e);
});
document.addEventListener('paste', e=>{
  if(currentStep!==3) return;
  const items=e.clipboardData?.items; if(!items) return;
  const files=[];
  for(const it of items){ if(it.type.startsWith('image/')) files.push(it.getAsFile()); }
  if(files.length){ e.preventDefault(); addPhotos(files); }
});

/* —— Template fill helpers (string-level, Word-safe) —— */
function tcInnerText(tcXml) {
  return [...tcXml.matchAll(/<w:t[^>]*>([^<]*)<\/w:t>/g)].map(m => m[1]).join('');
}
function makeTc(text, tcPrXml) {
  /* Plain fill only — do not change fonts/bold of company template */
  const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const pr = tcPrXml || '<w:tcPr><w:tcW w:w="2000" w:type="dxa"/></w:tcPr>';
  return `<w:tc>${pr}<w:p><w:r><w:t xml:space="preserve">${esc(text)}</w:t></w:r></w:p></w:tc>`;
}
function checkFormCheckbox(cbXml, checked) {
  let x = cbXml;
  if (checked) {
    x = x.replace(/<w:default w:val="0"\/>/g, '<w:default w:val="1"/>');
    if (!/<w:checked/.test(x)) {
      x = x.replace(/<\/w:checkBox>/, '<w:checked w:val="1"/></w:checkBox>');
    } else {
      x = x.replace(/<w:checked[^\/]*\/>/g, '<w:checked w:val="1"/>');
    }
  }
  return x;
}
function extractTcPr(tcXml) {
  const m = tcXml.match(/<w:tcPr[\s>][\s\S]*?<\/w:tcPr>/);
  return m ? m[0] : null;
}
function splitTcs(tblXml) {
  const re = /<w:tc[\s>][\s\S]*?<\/w:tc>/g;
  const out = [];
  let m;
  while ((m = re.exec(tblXml))) out.push(m[0]);
  return out;
}
function replaceTcsInTable(tblXml, newTcs) {
  let i = 0;
  return tblXml.replace(/<w:tc[\s>][\s\S]*?<\/w:tc>/g, () => newTcs[i++] || '');
}

async function exportFM1201_1() {
  if (typeof JSZip === 'undefined') throw new Error('JSZip 未載入（內嵌函式庫異常，請重新整理頁面）');
  const m = state.meta;
  const bin = Uint8Array.from(atob(TPL_FM1201_1), c => c.charCodeAt(0));
  const zip = await JSZip.loadAsync(bin);
  let xml = await zip.file('word/document.xml').async('string');

  const auditDate = formatAuditDateRange(m.dateFrom, m.dateTo);

  // Date of notification — keep original title text; only append the date value after it
  xml = xml.replace(
    /(<w:p[\s>][\s\S]*?[Nn]otification[\s\S]*?<\/w:p>)/,
    (para) => {
      const val = String(m.notificationDate || '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
      // Remove value run appended by a previous export (id marker)
      let core = para.replace(/<w:r[^>]*>\s*<w:rPr>[\s\S]*?<\/w:rPr>\s*<w:t[^>]*>__NOTIF__<[\s\S]*?<\/w:t>\s*<\/w:r>/g, '');
      // Fallback: if previous export used plain append without marker, strip trailing date-only run after last colon run — skip; one-shot fill is fine
      if (core.endsWith('</w:p>')) {
        core = core.slice(0, -6)
          + '<w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/></w:rPr>'
          + '<w:t xml:space="preserve">' + val + '</w:t></w:r></w:p>';
      }
      return core;
    }
  );

  // Tables in order
  const tblRe = /<w:tbl[\s>][\s\S]*?<\/w:tbl>/g;
  const tables = xml.match(tblRe) || [];
  if (tables.length < 2) throw new Error('範本表格結構異常');

  // Table 0: 3 rows × 4 cells → values at odd indices
  {
    const tcs = splitTcs(tables[0]);
    const values = [m.vessel||'', m.refNo||'', auditDate, m.place||'', m.leadAuditor||'', m.coAuditor||''];
    let vi = 0;
    const newTcs = tcs.map((tc, i) => {
      if (i % 2 === 1) {
        const pr = extractTcPr(tc);
        return makeTc(values[vi++] || '', pr);
      }
      return tc;
    });
    const newTbl = replaceTcsInTable(tables[0], newTcs);
    xml = xml.replace(tables[0], newTbl);
  }

  // Table 1: header + plan rows (3 cells each)
  {
    // re-match tables after first replace
    const tables2 = xml.match(tblRe) || [];
    const planTbl = tables2[1];
    const tcs = splitTcs(planTbl);
    // first 3 = header
    const newTcs = tcs.slice();
    state.auditPlan.forEach((plan, i) => {
      const base = 3 + i * 3;
      if (base + 2 >= newTcs.length) return;
      newTcs[base] = makeTc(plan.time || '', extractTcPr(tcs[base]));
      newTcs[base + 1] = makeTc(plan.scope || '', extractTcPr(tcs[base + 1]));
      newTcs[base + 2] = makeTc(plan.remark || '', extractTcPr(tcs[base + 2]));
    });
    const newTbl = replaceTcsInTable(planTbl, newTcs);
    xml = xml.replace(planTbl, newTbl);
  }

  zip.file('word/document.xml', xml);
  const blob = await zip.generateAsync({
    type: 'blob',
    mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
  });
  const name = `FM-1201-1_${(m.vessel || 'vessel').replace(/\s/g, '_')}_${m.refNo || 'audit'}.docx`;
  downloadBlob(blob, name);
  toast('已匯出 FM-1201-1（公司空白表單填入）');
}

/* ===== Save / Load ===== */
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(autosave,400);
}
function autosave(){
  try{
    const light={uid, currentStep, photoTab, meta:state.meta, auditPlan:state.auditPlan, findings:state.findings, collapsed:state.collapsed,
      photoMeta:state.photos.map(p=>({id:p.id,tag:p.tag,findingNo:p.findingNo})),
      ncs:state.ncs, capa:state.capa, interview:state.interview,
      auditorCommentsExtra:state.auditorCommentsExtra, commentSections:state.commentSections,
      checklistAllYes:state.checklistAllYes, checklistExceptions:state.checklistExceptions||[], ssir:state.ssir};
    localStorage.setItem(STORAGE_KEY, JSON.stringify(light));
    // photos in session only
    sessionStorage.setItem(STORAGE_KEY+'_photos', JSON.stringify({uid, photos:state.photos}));
    const t=new Date();
    const el=document.getElementById('saveStat');
    if(el) el.textContent=`已暫存 ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`;
  }catch(e){
    const el=document.getElementById('saveStat');
    if(el) el.textContent='暫存空間不足（請用暫存檔備份）';
  }
}
function restore(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const d=JSON.parse(raw);
      if(d.meta) state.meta=d.meta;
      if(d.auditPlan) state.auditPlan=d.auditPlan;
      if(d.findings) state.findings=d.findings;
      if(d.collapsed) state.collapsed=d.collapsed;
      if(d.uid) uid=d.uid;
      if(typeof d.currentStep==='number') currentStep=d.currentStep;
      if(d.photoTab) photoTab=d.photoTab;
      if(d.ncs) state.ncs=d.ncs;
      if(d.capa) state.capa=d.capa;
      if(d.interview) state.interview=d.interview;
      if(d.auditorCommentsExtra!=null) state.auditorCommentsExtra=d.auditorCommentsExtra;
      if(d.commentSections) state.commentSections=d.commentSections;
      if(typeof d.checklistAllYes==='boolean') state.checklistAllYes=d.checklistAllYes;
      if(d.checklistExceptions) state.checklistExceptions=d.checklistExceptions;
      if(d.ssir) state.ssir=d.ssir;
    }
  }catch(e){}
  if(currentStep<0 || currentStep>=STEPS.length) currentStep=0;
  try{
    const rawP=sessionStorage.getItem(STORAGE_KEY+'_photos');
    if(rawP){
      const d=JSON.parse(rawP);
      if(d.photos) state.photos=d.photos;
      if(d.uid) uid=Math.max(uid,d.uid);
    }
  }catch(e){}
  try{ applyLoadedFindingsAndTags(); }catch(e){}
}

/** Snapshot for save: photos (tag/findingNo/img) + findings (descZh/descEn/tag) */
function buildProjectPayload(){
  // ensure findings cover every photo group
  (state.photos||[]).forEach(p=>{
    const k=String(p.findingNo||'');
    if(!k) return;
    if(!state.findings) state.findings={};
    if(!state.findings[k]) state.findings[k]={descZh:'',descEn:'',tag:p.tag||'FINDING'};
    if(p.tag) state.findings[k].tag=p.tag;
  });
  return {
    version: 4,
    uid,
    savedAt: new Date().toISOString(),
    currentStep,
    photoTab,
    state: state,
    // explicit copies so older/newer loaders always see them
    photos: (state.photos||[]).map(p=>({
      id:p.id, img:p.img, tag:p.tag||'FINDING', findingNo:p.findingNo
    })),
    findings: state.findings||{},
    meta: state.meta,
    auditPlan: state.auditPlan,
    ncs: state.ncs,
    capa: state.capa
  };
}
function applyLoadedFindingsAndTags(){
  if(!state.findings) state.findings={};
  if(!Array.isArray(state.photos)) state.photos=[];
  // Apply findings tags onto photos if photo.tag missing
  state.photos.forEach(p=>{
    const k=String(p.findingNo||'');
    if(!k) return;
    const f=state.findings[k];
    if(f){
      if(!p.tag && f.tag) p.tag=f.tag;
      // keep findings tag in sync with photo
      if(p.tag) f.tag=p.tag;
    } else {
      state.findings[k]={descZh:'',descEn:'',tag:p.tag||'FINDING'};
    }
  });
}
function saveProject(){
  const payload=buildProjectPayload();
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const name=`${(state.meta.vessel||'audit').replace(/\W/g,'_')}_${state.meta.refNo||'draft'}_unified.json`;
  downloadBlob(blob,name);
  document.getElementById('projectLabel').textContent=name;
  const n=(state.photos||[]).length;
  const f=Object.keys(state.findings||{}).length;
  toast(n?`專案已下載（${n} 張照片、${f} 項敘述／標誌）`:'專案已下載');
}
function loadProject(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const d=JSON.parse(fr.result);
        const base = blankState();
        // Accept: {state,uid,photos} | raw state | legacy flat
        let src = null;
        if(d && d.state && typeof d.state==='object') src = d.state;
        else if(d && (d.meta || d.photos || d.findings || d.auditPlan)) src = d;
        else throw new Error('無法辨識的專案格式（需要含 state 或 meta）');

        // Merge without letting undefined wipe defaults
        const merge = (target, source) => {
          if(!source || typeof source!=='object') return target;
          Object.keys(source).forEach(k=>{
            if(source[k]===undefined) return;
            target[k]=source[k];
          });
          return target;
        };
        state = merge(base, src);

        // Photos from multiple places
        if((!state.photos || !state.photos.length) && Array.isArray(d.photos)) state.photos = d.photos;
        if((!state.photos || !state.photos.length) && Array.isArray(src.photos)) state.photos = src.photos;
        if(!Array.isArray(state.photos)) state.photos = [];
        if(!Array.isArray(state.ncs)) state.ncs = [];
        if(!state.capa || typeof state.capa!=='object') state.capa = {};
        if(!state.findings || typeof state.findings!=='object') state.findings = {};
        if(!Array.isArray(state.auditPlan) || !state.auditPlan.length)
          state.auditPlan = DEFAULT_PLAN.map(r=>({...r}));
        if(!state.interview) state.interview = {deckRank:'',deckName:'',engRank:'',engName:'',ratingRank:'',ratingName:''};
        if(!Array.isArray(state.checklistExceptions)) state.checklistExceptions = [];
        if(typeof state.checklistAllYes!=='boolean') state.checklistAllYes = true;
        if(!state.meta || typeof state.meta!=='object') state.meta = base.meta;

        uid = d.uid || src.uid || (Math.max(0, ...state.photos.map(p=>p.id||0)) + 1) || 1;
        if(typeof d.currentStep==='number') currentStep = d.currentStep;
        else if(typeof src.currentStep==='number') currentStep = src.currentStep;
        if(currentStep<0 || currentStep>=STEPS.length) currentStep = 0;
        if(d.photoTab) photoTab = d.photoTab;

        // Explicit findings (中英敘述 + 標誌)
        if(d.findings && typeof d.findings==='object') state.findings = Object.assign({}, state.findings||{}, d.findings);
        if(src.findings && typeof src.findings==='object') state.findings = Object.assign({}, state.findings||{}, src.findings);
        applyLoadedFindingsAndTags();

        try{
          sessionStorage.setItem(STORAGE_KEY+'_photos', JSON.stringify({uid, photos:state.photos}));
        }catch(e){ console.warn('sessionStorage photos', e); }

        renderSidebar();
        renderStep();
        scheduleSave();
        const n = state.photos.length;
        const f = Object.keys(state.findings||{}).length;
        toast(n ? `專案已載入（${n} 張照片、${f} 項敘述／標誌）` : '專案已載入');
      }catch(e){
        console.error(e);
        alert('無法讀取檔案：'+(e.message||e));
      }
    };
    fr.onerror=()=>alert('讀取檔案失敗');
    fr.readAsText(inp.files[0]);
  };
  inp.click();
}

function confirmNew(){
  if(!confirm('開始新專案？未暫存的資料將清除。')) return;
  state=blankState(); uid=1; currentStep=0; photoTab='ALL';
  try{ localStorage.removeItem(STORAGE_KEY); sessionStorage.removeItem(STORAGE_KEY+'_photos'); }catch(e){}
  renderSidebar(); renderStep(); toast('已開新專案');
}


/* ========== Phase 2: NC sync + Photo report + 1201-3 + 0901-1 ========== */
function syncNcsFromPhotos(){
  if(!state.ncs) state.ncs = [];
  if(!state.capa) state.capa = {};
  if(!state.findings) state.findings = {};
  if(!state.photos) state.photos = [];
  // Prefer photo.tag; also treat findings.tag===NC when photos aligned
  const groups = groupPhotos('NC').filter(g => (g.tag||'') === 'NC');
  // Stable match: by findingNo first, else by id still in list
  const byNo = new Map();
  state.ncs.forEach(n => {
    if(n && n.findingNo != null) byNo.set(String(n.findingNo), n);
  });
  const used = new Set();
  const next = [];
  groups.forEach(g => {
    const key = String(g.findingNo);
    const descEn = (g.desc && g.desc.descEn) || (state.findings[key]&&state.findings[key].descEn) || '';
    const descZh = (g.desc && g.desc.descZh) || (state.findings[key]&&state.findings[key].descZh) || '';
    // 中英都有時優先英文（報告用），否則中文
    const deviation = (descEn && descZh) ? descEn : (descEn || descZh || '');
    let old = byNo.get(key);
    if(old && used.has(old.id)) old = null;
    if(old){
      // 自動帶入：敘述以照片彙整為準（使用者可在 1201-3 再改）
      old.deviation = deviation;
      old.findingNo = g.findingNo;
      next.push(old);
      used.add(old.id);
    } else {
      const row = {
        id: 'nc_'+key+'_'+Math.random().toString(36).slice(2,8),
        findingNo: g.findingNo,
        regulation: '',
        standard: '',
        category: 'Minor',
        requirement: '',
        deviation: deviation,
        corrective: '',
        dueDate: ''
      };
      next.push(row);
      used.add(row.id);
    }
  });
  // Sort by finding number for stable UI
  next.sort((a,b)=>(a.findingNo||0)-(b.findingNo||0));
  state.ncs = next;
  // ensure capa shell for current NCs only
  state.ncs.forEach(n => {
    if(!state.capa[n.id]) state.capa[n.id] = {
      rootPrimary: '', rootSecondary: '', rootOther: '',
      corrective: n.corrective||'', preventive: '',
      responsibleRank: '', responsibleName: '',
      preparedBy: '', masterName: '',
      issueDate: (state.meta && state.meta.dateFrom) || '',
      dueDate: n.dueDate||''
    };
    // keep capa corrective in sync if still empty
    if(!state.capa[n.id].corrective && n.corrective) state.capa[n.id].corrective = n.corrective;
  });
}

function dataURLToBytes(dataURL){
  const base64 = dataURL.split(',')[1];
  const bin = atob(base64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}
function jpegSize(bytes){
  let i=2;
  if(bytes[0]!==0xFF||bytes[1]!==0xD8) return {width:800,height:600};
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  while(i<bytes.length-8){
    if(bytes[i]!==0xFF){ i++; continue; }
    const marker=bytes[i+1];
    if(marker===0xC0||marker===0xC1||marker===0xC2||marker===0xC3){
      return {width:dv.getUint16(i+7), height:dv.getUint16(i+5)};
    }
    const len=dv.getUint16(i+2);
    i+=2+len;
  }
  return {width:800,height:600};
}
const EMU_PER_IN = 914400;

async function exportPhotoReport(){
  if(typeof JSZip==='undefined') throw new Error('JSZip 未載入（內嵌函式庫異常，請重新整理頁面）');
  const groups = groupsOBFinding();
  if(!groups.length){ toast('沒有 OB/Finding 可匯出'); return; }
  const m = state.meta;
  const W = 9638;
  const idxW = 554;
  const half = Math.floor((W - idxW) / 2);
  const colW = [idxW, half, W - idxW - half];
  const imgMaxIn = Math.max(2.0, (half / 1440) * 0.9);

  const mediaFiles = [];
  const imageRels = [];
  let relId = 1, drawSeq = 1;
  function addImage(bytes){
    const id = 'rIdImg'+(relId++);
    const name = `image${mediaFiles.length+1}.jpeg`;
    mediaFiles.push({name, bytes});
    imageRels.push({id, target:'media/'+name});
    return id;
  }
  function imageParagraph(dataURL, maxW){
    const bytes = dataURLToBytes(dataURL);
    const {width,height} = jpegSize(bytes);
    const ratio = height/Math.max(width,1);
    const wIn = maxW, hIn = maxW*ratio;
    const cx = Math.round(wIn*EMU_PER_IN), cy = Math.round(hIn*EMU_PER_IN);
    const rId = addImage(bytes);
    const drawId = drawSeq++;
    return `<w:p><w:pPr><w:spacing w:after="80"/><w:jc w:val="center"/></w:pPr><w:r><w:drawing>
      <wp:inline distT="0" distB="0" distL="0" distR="0"
        xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"
        xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"
        xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">
        <wp:extent cx="${cx}" cy="${cy}"/>
        <wp:docPr id="${drawId}" name="Picture ${drawId}"/>
        <a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">
          <pic:pic>
            <pic:nvPicPr><pic:cNvPr id="${drawId}" name="Picture ${drawId}"/><pic:cNvPicPr/></pic:nvPicPr>
            <pic:blipFill><a:blip r:embed="${rId}" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>
            <pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>
          </pic:pic>
        </a:graphicData></a:graphic>
      </wp:inline>
    </w:drawing></w:r></w:p>`;
  }
  function tcSpan(w, span, content){
    return `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/><w:gridSpan w:val="${span}"/></w:tcPr>${content}</w:tc>`;
  }
  

  const titleLeft = `Deficiency items of ${m.vessel||''}${m.cn?' '+m.cn:''} 內稽缺失項目`;
  const titleDate = formatAuditDate(m.dateFrom||m.dateTo||'');
  const titlePara2 =
    `<w:p><w:pPr><w:tabs><w:tab w:val="right" w:pos="${W-160}"/></w:tabs><w:spacing w:after="60"/></w:pPr>` +
    run(titleLeft,{bold:true,size:22}) +
    `<w:r><w:rPr><w:rFonts w:ascii="Calibri" w:eastAsia="標楷體" w:hAnsi="Calibri"/><w:b/><w:sz w:val="22"/></w:rPr><w:tab/></w:r>` +
    run(titleDate,{bold:true,size:22}) + `</w:p>`;

  let findRows = tr(tcSpan(W, 3, titlePara2));
  groups.forEach((g,i)=>{
    const en=(g.desc&&g.desc.descEn)||'';
    const zh=(g.desc&&g.desc.descZh)||'';
    let descXml='';
    const label = g.tag === 'OB' ? 'OB' : 'Finding';
    descXml += para([run(`${label}`,{bold:true})],{after:20});
    if(en) descXml += para([run(en,{bold:true})],{after:zh?20:40,align:'both'});
    if(zh) descXml += para([run(zh)],{after:40,align:'both'});
    if(!en&&!zh) descXml += para([run('')]);
    findRows += tr(
      tc(colW[0], para([run(`${i+1}.`,{bold:true})],{align:'center'})) +

    findRows += tr(

    const imgs = g.photos.map(p=>imageParagraph(p.img, imgMaxIn)).join('') || para([run('')]);
    findRows += tr(
      tc(colW[0], para([run('')])) +
      tc(colW[1], imgs) +
      tc(colW[2], para([run('')]))
    );
  });

  let body = para([run('Please refer to the table below for the findings from this visit and rectify the defects according to the priorities indicated.')],{after:160});
  body += `<w:tbl>
    <w:tblPr><w:tblW w:w="${W}" w:type="dxa"/>
      <w:tblBorders>
        <w:top w:val="single" w:sz="4" w:space="0" w:color="000000"/>
        <w:left w:val="single" w:sz="4" w:space="0" w:color="000000"/>

/* ===== Export ALL photos as ZIP =====
   Bundles every photo currently in the project — both the photo-aggregation step (state.photos,
   including empty-findings-with-no-photos which are simply skipped) and FM-1201-6's inspection
   record photos + before/after defect photos — into one ZIP the user can save locally.
   Folder layout:
     照片彙整/NC-01/, 照片彙整/OB-02/, 照片彙整/Finding-03/ ... (one folder per finding, tag+number)
     FM-1201-6/檢查記錄/<section name>/
     FM-1201-6/缺失-01/Before/, FM-1201-6/缺失-01/After/
*/
async function exportAllPhotosZip(){
  if(typeof JSZip==='undefined') throw new Error('JSZip 未載入（內嵌函式庫異常，請重新整理頁面）');
  const zip = new JSZip();
  let count = 0;
  const safe = s => String(s||'').replace(/[\\/:*?"<>|]/g,'_').trim() || 'untitled';

  // 1) Photo aggregation (Step 3) — group by finding, same numbering/tag as on screen
  const groups = groupPhotos('ALL');
  groups.forEach(g=>{
    if(!g.photos.length) return; // empty findings have nothing to zip
    const folder = `照片彙整/${g.tag}-${String(g.findingNo).padStart(2,'0')}`;
    g.photos.forEach((p,pi)=>{
      const bytes = dataURLToBytes(p.img);
      zip.file(`${folder}/photo_${String(pi+1).padStart(2,'0')}.jpg`, bytes);
      count++;
    });
  });

  // 2) FM-1201-6 — inspection record photos (by section) + defect before/after photos
  if(state.ssir){
    const s = state.ssir;
    if(s.recordPhotos){
      Object.keys(s.recordPhotos).forEach(section=>{
        const photos = s.recordPhotos[section]||[];
        if(!photos.length) return;
        const folder = `FM-1201-6/檢查記錄/${safe(section)}`;
        photos.forEach((src,pi)=>{
          const bytes = dataURLToBytes(src);
          zip.file(`${folder}/photo_${String(pi+1).padStart(2,'0')}.jpg`, bytes);
          count++;
        });
      });
    }
    (s.defects||[]).forEach((d,di)=>{
      const no = String(di+1).padStart(2,'0');
      (d.beforePhotos||[]).forEach((src,pi)=>{
        const bytes = dataURLToBytes(src);
        zip.file(`FM-1201-6/缺失-${no}/Before/photo_${String(pi+1).padStart(2,'0')}.jpg`, bytes);
        count++;
      });
      (d.afterPhotos||[]).forEach((src,pi)=>{
        const bytes = dataURLToBytes(src);
        zip.file(`FM-1201-6/缺失-${no}/After/photo_${String(pi+1).padStart(2,'0')}.jpg`, bytes);
        count++;
      });
    });
  }

  if(!count){ toast('目前沒有任何照片可另存'); return; }

  const blob = await zip.generateAsync({type:'blob', mimeType:'application/zip'});
  const m = state.meta||{};
  const datePart = (m.dateFrom||'').replace(/\D/g,'').slice(0,8) || new Date().toISOString().slice(0,10).replace(/-/g,'');
  const name = `${datePart} ${safe(m.vessel||'audit')} 全部照片.zip`;
  downloadBlob(blob, name);
  toast(`已打包 ${count} 張照片為 ZIP`);
}

async function exportFM1201_3(){
  syncNcsFromPhotos();
  if(!state.ncs.length){ toast('沒有 NC 可匯出'); return; }
  if(typeof JSZip==='undefined') throw new Error('JSZip 未載入（內嵌函式庫異常，請重新整理頁面）');
  const m = state.meta;
  const bin = Uint8Array.from(atob(TPL_FM1201_3), c => c.charCodeAt(0));
  const zip = await JSZip.loadAsync(bin);
  let xml = await zip.file('word/document.xml').async('string');

  // Table 0: header meta — 2 rows × 4 cells, values at odd indices
  const tblRe = /<w:tbl[\s>][\s\S]*?<\/w:tbl>/g;
  const tables = xml.match(tblRe) || [];
  if (tables.length < 2) throw new Error('1201-3 範本表格異常');

  {
    const tcs = splitTcs(tables[0]);
    const values = [m.vessel||'', m.refNo||'', m.leadAuditor||'', m.coAuditor||''];
    let vi = 0;
    const newTcs = tcs.map((tc, i) => {
      if (i % 2 === 1) return makeTc(values[vi++] || '', extractTcPr(tc));
      return tc;
    });
    xml = xml.replace(tables[0], replaceTcsInTable(tables[0], newTcs));
  }

  // Table 1: up to 4 NC blocks (header row + content row) × 4
  {
    const tables2 = xml.match(tblRe) || [];
    const planTbl = tables2[1];
    const tcs = splitTcs(planTbl);
    // structure: for each block i: header has 7 cells, content has 1 cell
    // cell index map: block0 header cells 0-6, content 7; block1 header 8-14, content 15; ...
    const newTcs = tcs.slice();
    for (let i = 0; i < 4; i++) {
      const n = state.ncs[i];
      const h0 = i * 8; // start of header cells in flat list — wait: 7+1=8
      // verify: block0: cells 0..6 header, 7 content; block1: 8..14, 15; ...
      const base = i * 8;
      if (base + 7 >= newTcs.length) break;
      if (!n) continue;
      const no = `NC-${String(i+1).padStart(2,'0')}`;
      // cells: 0=No. label, 1=value, 2=Reg/Std label, 3=value, 4=Category, 5=Major, 6=Minor
      newTcs[base+1] = makeTc(no, extractTcPr(tcs[base+1]));
      const regStd = [n.regulation, n.standard].filter(Boolean).join(' / ');
      newTcs[base+3] = makeTc(regStd, extractTcPr(tcs[base+3]));
      // Category markers in cells 5/6 — append check mark text carefully
      const majorMark = n.category === 'Major' ? '☑ Major' : '☐ Major';
      const minorMark = n.category === 'Minor' ? '☑ Minor' : '☐ Minor';
      newTcs[base+5] = makeTc(majorMark, extractTcPr(tcs[base+5]));
      newTcs[base+6] = makeTc(minorMark, extractTcPr(tcs[base+6]));
      // content cell: rewrite with three sections
      const pr = extractTcPr(tcs[base+7]);
      const esc = (s) => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const p = (label, val) =>
        `<w:p><w:r><w:t>${esc(label)}</w:t></w:r></w:p>`+
        `<w:p><w:r><w:t xml:space="preserve">${esc(val)}</w:t></w:r></w:p>`;
      newTcs[base+7] =
        `<w:tc>${pr||''}`+
        p('Regulation/Standard requirement:', n.requirement)+
        p('The deviation of requirement:', n.deviation)+
        p('Corrective action:', n.corrective)+
        `</w:tc>`;
    }
    xml = xml.replace(planTbl, replaceTcsInTable(planTbl, newTcs));
  }

  // Due date paragraph
  const due = state.ncs.map(n=>n.dueDate).filter(Boolean)[0] || '';
  xml = xml.replace(
    /(<w:p[\s>][\s\S]*?before date:[\s\S]*?<\/w:p>)/i,
    (para) => {
      let core = para;
      if (core.endsWith('</w:p>')) {
        core = core.slice(0, -6)
          + `<w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/></w:rPr>`
          + `<w:t xml:space="preserve">${String(due).replace(/&/g,'&amp;').replace(/</g,'&lt;')}</w:t></w:r></w:p>`;
      }
      return core;
    }
  );

  zip.file('word/document.xml', xml);
  const blob = await zip.generateAsync({
    type:'blob',
    mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
  });
  downloadBlob(blob, `FM-1201-3_${(m.vessel||'vessel').replace(/\s/g,'_')}_${m.refNo||'audit'}.docx`);
  toast('已匯出 FM-1201-3（公司空白表單填入）');
}

async function exportFM0901_1(){

  if(typeof JSZip==='undefined') throw new Error('JSZip 未載入（內嵌函式庫異常，請重新整理頁面）');
  const m = state.meta;
  const rprim = {1:'1) People related',2:'2) Resources related',3:'3) Monitoring related',other:'Other'};
  const rsec = {
    '1-1':'1-1) Inadequate Person Fitness','1-2':'1-2) Physical/Mental Stress','1-3':'1-3) Inadequate Knowledge',
    '1-4':'1-4) Inadequate Skills','1-5':'1-5) Inadequate Motivation',
    '2-1':'2-1) Inadequate System Design','2-2':'2-2) Inadequate Purchasing','2-3':'2-3) Inadequate Maintenance',
    '2-4':'2-4) Inadequate Tools/Equipment','2-5':'2-5) Inadequate Work Environment',
    '3-1':'3-1) Inadequate Work Standards','3-2':'3-2) Inadequate Procedures','3-3':'3-3) Inadequate Supervision',
    '3-4':'3-4) Inadequate Communication','3-5':'3-5) Unforeseen/Beyond Control','other':'Other'
  };

  /** Keep original runs/rPr (red/bold). Only replace placeholders or append plain text. */
  function escXml(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function appendPlainToCell(cell, text){
    if(!text) return cell;
    const add = `<w:p><w:r><w:t xml:space="preserve">${escXml(text)}</w:t></w:r></w:p>`;
    return cell.replace(/<\/w:tc>\s*$/, add + '</w:tc>');
  }
  function replaceClickInCell(cell, value){
    if(!value) return cell;
    if(/Click here to select/i.test(cell)){
      return cell.replace(/Click here to select(?: a date)?/i, () => escXml(value));
    }
    return appendPlainToCell(cell, value);
  }

  for (let i = 0; i < state.ncs.length; i++) {
    const n = state.ncs[i];
    const c = state.capa[n.id] || {};
    const bin = Uint8Array.from(atob(TPL_FM0901_1), c0 => c0.charCodeAt(0));
    const zip = await JSZip.loadAsync(bin);
    let xml = await zip.file('word/document.xml').async('string');

    // Name of Ship — append value, keep original label formatting
    xml = xml.replace(
      /(<w:p[\s>][\s\S]*?Name of Ship:[\s\S]*?<\/w:p>)/i,
      (para) => {
        if ((m.vessel||'') && para.includes(escXml(m.vessel))) return para;
        return para.replace(/<\/w:p>\s*$/,
          `<w:r><w:t xml:space="preserve">${escXml(m.vessel||'')}</w:t></w:r></w:p>`);
      }
    );

    const tblRe = /<w:tbl[\s>][\s\S]*?<\/w:tbl>/g;
    const tables = xml.match(tblRe) || [];
    if (!tables.length) throw new Error('0901-1 範本無表格');
    const tcs = splitTcs(tables[0]);
    const newTcs = tcs.slice();

    // indices from company form layout
    // 1 issue date, 3 due date, 5 regulations, 6 description, 7 rank, 9 name, 10 root, 11 corrective, 12 preventive
    if (newTcs[1]) newTcs[1] = replaceClickInCell(tcs[1], c.issueDate || m.dateFrom || '');
    if (newTcs[3]) newTcs[3] = replaceClickInCell(tcs[3], c.dueDate || n.dueDate || '');
    if (newTcs[5]) {
      const reg = [n.regulation, n.standard].filter(Boolean).join(' / ');
      newTcs[5] = appendPlainToCell(tcs[5], reg);
    }
    if (newTcs[6]) newTcs[6] = appendPlainToCell(tcs[6], n.deviation || '');
    if (newTcs[7]) newTcs[7] = appendPlainToCell(tcs[7], c.responsibleRank || '');
    if (newTcs[9]) newTcs[9] = appendPlainToCell(tcs[9], c.responsibleName || '');

    // Root causes 3.1 / 3.2 — fill two "Click here to select" in order
    if (newTcs[10]) {
      let cell = tcs[10];
      const pTxt = (c.rootPrimary==='other' && c.rootOther) ? ('Other: '+c.rootOther) : (rprim[c.rootPrimary]||c.rootPrimary||'');
      const sTxt = (c.rootSecondary==='other' && c.rootOther2) ? ('Other: '+c.rootOther2)
        : (c.rootSecondary==='other' && c.rootOther) ? ('Other: '+c.rootOther) : (rsec[c.rootSecondary]||c.rootSecondary||'');
      let nClick = 0;
      cell = cell.replace(/Click here to select/gi, () => {
        nClick++;
        if (nClick === 1) return escXml(pTxt || 'Click here to select');
        if (nClick === 2) return escXml(sTxt || 'Click here to select');
        return 'Click here to select';
      });
      if (nClick === 0 && (pTxt || sTxt)) {
        cell = appendPlainToCell(cell, [pTxt, sTxt].filter(Boolean).join('\n'));
      }
      newTcs[10] = cell;
    }
    if (newTcs[11]) newTcs[11] = appendPlainToCell(tcs[11], c.corrective || n.corrective || '');
    if (newTcs[12]) newTcs[12] = appendPlainToCell(tcs[12], c.preventive || '');

    // Prepared by / Master — append names only, keep labels
    if (newTcs[13] && c.preparedBy) newTcs[13] = appendPlainToCell(tcs[13], c.preparedBy);
    if (newTcs[15] && c.masterName) newTcs[15] = appendPlainToCell(tcs[15], c.masterName);

    xml = xml.replace(tables[0], replaceTcsInTable(tables[0], newTcs));
    zip.file('word/document.xml', xml);
    const blob = await zip.generateAsync({
      type:'blob',
      mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    });
    const num = `NC-${String(i+1).padStart(2,'0')}`;
    downloadBlob(blob, `FM-0901-1_${num}_${(m.vessel||'vessel').replace(/\s/g,'_')}.docx`);
    await new Promise(r => setTimeout(r, 300));
  }
  toast(`已匯出 FM-0901-1 × ${state.ncs.length}（僅填入資料，保留原表紅字／粗體）`);
}

async function exportFM1201_2(){
  syncNcsFromPhotos();
  if(typeof JSZip==='undefined') throw new Error('JSZip 未載入（內嵌函式庫異常，請重新整理頁面）');
  const m = state.meta;
  const bin = Uint8Array.from(atob(TPL_FM1201_2), c => c.charCodeAt(0));
  const zip = await JSZip.loadAsync(bin);
  let xml = await zip.file('word/document.xml').async('string');
  const auditDate = formatAuditDateRange(m.dateFrom, m.dateTo);

  const tblRe = /<w:tbl[\s>][\s\S]*?<\/w:tbl>/g;
  const tables = xml.match(tblRe) || [];
  if (tables.length < 4) throw new Error('1201-2 範本表格異常');

  // Table 0 meta
  {
    const tcs = splitTcs(tables[0]);
    const values = [m.vessel||'', m.refNo||'', auditDate, m.place||'', m.leadAuditor||'', m.coAuditor||''];
    let vi=0;
    const newTcs = tcs.map((tc,i)=>{
      if(i%2===1) return makeTc(values[vi++]||'', extractTcPr(tc));
      return tc;
    });
    xml = xml.replace(tables[0], replaceTcsInTable(tables[0], newTcs));
  }

  // Table 1 NC, Table 2 Observations
  const ncs = state.ncs;
  const obs = groupPhotos('ALL').filter(g => g.tag==='OB');

  function fillFindingTable(tblXml, items, mapper) {
    const tcs = splitTcs(tblXml);
    // header 3 cells, then 7 empty rows × 3
    const newTcs = tcs.slice();
    items.slice(0,7).forEach((item, i) => {
      const base = 3 + i*3;
      if (base+2 >= newTcs.length) return;
      const [a,b,c] = mapper(item, i);
      newTcs[base] = makeTc(a, extractTcPr(tcs[base]));
      newTcs[base+1] = makeTc(b, extractTcPr(tcs[base+1]));
      newTcs[base+2] = makeTc(c, extractTcPr(tcs[base+2]));
    });
    return replaceTcsInTable(tblXml, newTcs);
  }

  {
    const tables2 = xml.match(tblRe) || [];
    const ncTbl = fillFindingTable(tables2[1], ncs, (n,i) => [
      String(i+1),
      n.deviation || '',
      [n.regulation, n.standard].filter(Boolean).join(' / ')
    ]);
    xml = xml.replace(tables2[1], ncTbl);
  }
  {
    const tables3 = xml.match(tblRe) || [];
    const obTbl = fillFindingTable(tables3[2], obs, (g,i) => {
      const en=(g.desc&&g.desc.descEn)||'';
      const zh=(g.desc&&g.desc.descZh)||'';
      return [String(i+1), en||zh||'', ''];
    });
    xml = xml.replace(tables3[2], obTbl);
  }

  // Auditor comments table (table 3) — plain text only, no bold/font change
  {
    const tables4 = xml.match(tblRe) || [];
    if (tables4[3]) {
      const tcs = splitTcs(tables4[3]);
      if (tcs[0]) {
        const pr = extractTcPr(tcs[0]);
        const escX = (s)=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
        const shipLine = `Vessel: ${m.vessel||''}${m.cn?' / '+m.cn:''}  Ref: ${m.refNo||''}  Audit: ${auditDate}  Place: ${m.place||''}`;
        let parts = ['Auditor comments:', shipLine, ''];
        ensureCommentSections();
        state.commentSections.forEach(sec => {
          parts.push(sec.title);
          if (sec.text) parts.push(sec.text);
          parts.push('');
        });
        if (state.auditorCommentsExtra) {
          parts.push('Auditor additional comments:');
          parts.push(state.auditorCommentsExtra);
        }
        const paras = parts.map(t => `<w:p><w:r><w:t xml:space="preserve">${escX(t)}</w:t></w:r></w:p>`).join('');
        const cell = `<w:tc>${pr||''}${paras}</w:tc>`;
        xml = xml.replace(tables4[3], replaceTcsInTable(tables4[3], [cell]));
      }
    }
  }

  zip.file('word/document.xml', xml);
  const blob = await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  downloadBlob(blob, `FM-1201-2_${(m.vessel||'vessel').replace(/\s/g,'_')}_${m.refNo||'audit'}.docx`);
  toast('已匯出 FM-1201-2（公司空白表單填入）');
}

function checklistItemOptions(selectedKey){

      return `<option value="${esc(it.key)}" ${it.key===selectedKey?'selected':''}>${esc(label)}</option>`;
